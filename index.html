<style>
/* Layout: a two-mode study app — flashcard decks on the left of mind, quiz runner centre-stage.
   Warm paper-ink identity for the "lab notebook" feel, teal accent for action, amber for review. */
:root{
  --bg:#f4f1ea;           /* warm paper */
  --surface:#fffdf8;      /* card */
  --surface-2:#efeadf;    /* sunken */
  --ink:#282420;          /* near-black ink, warm */
  --ink-soft:#6b655c;     /* muted ink */
  --line:#ddd6c8;         /* hairline */
  --accent:#0e7c6b;       /* teal — primary action */
  --accent-soft:#d6ebe6;
  --amber:#b5781a;        /* review/retry */
  --amber-soft:#f3e4c9;
  --good:#1f7a4d;
  --good-soft:#d8ecdf;
  --bad:#b23b36;
  --bad-soft:#f3dcd9;
  --shadow:0 1px 2px rgba(40,36,32,.06),0 8px 24px rgba(40,36,32,.08);
  --r:14px;
  --maxw:860px;
  --serif:"Fraunces","Georgia",serif;
  --sans:"Inter","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#191714; --surface:#232019; --surface-2:#2c281f; --ink:#f0ebe1; --ink-soft:#a8a192;
  --line:#3a352b; --accent:#3ec9af; --accent-soft:#143c36; --amber:#e3a94a; --amber-soft:#3b2f18;
  --good:#5fc98c; --good-soft:#163a28; --bad:#e8766f; --bad-soft:#3d201e;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#191714; --surface:#232019; --surface-2:#2c281f; --ink:#f0ebe1; --ink-soft:#a8a192;
  --line:#3a352b; --accent:#3ec9af; --accent-soft:#143c36; --amber:#e3a94a; --amber-soft:#3b2f18;
  --good:#5fc98c; --good-soft:#163a28; --bad:#e8766f; --bad-soft:#3d201e;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:var(--maxw);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--serif);font-weight:600;text-wrap:balance;margin:0;line-height:1.15}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:1rem}
.btn{display:inline-flex;align-items:center;gap:.5em;padding:.7em 1.3em;border-radius:999px;font-weight:600;background:var(--accent);color:#fff;box-shadow:var(--shadow);transition:transform .08s,filter .15s;font-size:.98rem}
.btn:hover{filter:brightness(1.07)} .btn:active{transform:translateY(1px)}
.btn:focus-visible,button:focus-visible,.deck:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.amber{background:var(--amber)}
.btn[disabled]{opacity:.4;cursor:not-allowed;filter:none;transform:none}
.eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);font-weight:700}

/* ---- top bar ---- */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;padding-block:.65rem;gap:.5rem}
.brand{display:flex;align-items:center;gap:.6rem;font-family:var(--serif);font-weight:600;font-size:1.12rem}
.brand .dot{width:26px;height:26px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:.9rem;flex:none}
.brand{border:none;background:none;cursor:pointer}
.btn.sm{padding:.55em 1em;font-size:.86rem}
.deck-actions{display:flex;gap:.5rem;margin-top:.3rem}
.deck-actions .btn{flex:1}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);background:var(--surface);flex:none}

section.view{padding-block:1.6rem 4rem;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- home ---- */
.hero{margin-bottom:1.8rem}
.hero h1{font-size:clamp(1.9rem,6vw,2.9rem);margin-bottom:.4rem}
.hero p{color:var(--ink-soft);max-width:56ch;margin:0}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.deck{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1.15rem;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:.55rem;transition:transform .12s,border-color .15s}
.deck:hover{transform:translateY(-3px);border-color:var(--accent)}
.deck .top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem}
.deck h3{font-size:1.18rem}
.deck .tag{font-size:.68rem;font-weight:700;letter-spacing:.05em;padding:.2em .6em;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.deck .meta{font-size:.82rem;color:var(--ink-soft);display:flex;gap:.9rem;flex-wrap:wrap}
.deck .bar{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:.1rem}
.deck .bar>i{display:block;height:100%;background:var(--good);border-radius:999px;transition:width .5s}
.deck .status{font-size:.78rem;font-weight:600}
.callout{background:var(--amber-soft);border:1px solid color-mix(in srgb,var(--amber) 30%,transparent);border-radius:var(--r);padding:1rem 1.15rem;margin-bottom:1.6rem;display:flex;gap:.8rem;align-items:flex-start;font-size:.92rem}
.callout b{color:var(--amber)}

/* ---- flashcards ---- */
.fc-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1.2rem;flex-wrap:wrap}
.fc-count{font-size:.85rem;color:var(--ink-soft);font-weight:600}
.flash{perspective:1600px;max-width:560px;margin:0 auto}
.flash-inner{position:relative;width:100%;min-height:300px;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;cursor:pointer}
.flash.flipped .flash-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:1.8rem;display:flex;flex-direction:column;justify-content:center;gap:.8rem}
.face.back{transform:rotateY(180deg);justify-content:flex-start;overflow-y:auto}
.face .pos{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700}
.face .word{font-family:var(--serif);font-size:clamp(1.7rem,5vw,2.3rem);line-height:1.1}
.face .ipa{color:var(--ink-soft);font-size:.95rem;font-family:var(--sans)}
.flip-hint{text-align:center;color:var(--ink-soft);font-size:.8rem;margin-top:.3rem}
.def-block{margin-top:.2rem}
.def-label{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);font-weight:700;margin-bottom:.15rem}
.def-en{font-weight:500}
.def-vi{color:var(--ink-soft);font-style:italic;margin-top:.15rem}
.eg{background:var(--surface-2);border-left:3px solid var(--accent);border-radius:8px;padding:.6rem .8rem;font-size:.92rem;margin-top:.7rem}
.eg em{color:var(--accent);font-style:normal;font-weight:600}
.colloc{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.7rem}
.colloc span{font-size:.8rem;background:var(--accent-soft);color:var(--accent);padding:.2em .7em;border-radius:999px;font-weight:600}
.fc-nav{display:flex;align-items:center;justify-content:center;gap:1rem;margin-top:1.4rem}
.fc-nav .dots{display:flex;gap:.3rem;flex-wrap:wrap;max-width:260px;justify-content:center}
.fc-nav .dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.fc-nav .dots i.on{background:var(--accent);transform:scale(1.3)}
.fc-done{text-align:center;max-width:460px;margin:1.5rem auto 0;padding:1.3rem;background:var(--accent-soft);border-radius:var(--r)}

/* ---- quiz ---- */
.quiz-head{margin-bottom:1.1rem;display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap}
.qpos{font-size:.8rem;color:var(--ink-soft);font-weight:600;font-variant-numeric:tabular-nums}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:1.5rem}
.qtype{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:.7rem}
.qstem{font-size:1.18rem;line-height:1.5;margin-bottom:.3rem}
.qstem .blank{display:inline-block;min-width:92px;border-bottom:2.5px dashed var(--accent);text-align:center;font-weight:700;color:var(--accent);padding:0 .35em;line-height:1.1}
.qstem .blank:empty::after{content:"\00a0\00a0\00a0\00a0\00a0"}
.qstem .blank.filled{border-bottom-style:solid;background:var(--accent-soft);border-radius:5px 5px 0 0}
.qgloss{font-size:.88rem;color:var(--ink-soft);font-style:italic;margin-bottom:1.1rem}
.opts{display:flex;flex-direction:column;gap:.6rem}
.opt{text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:.85rem 1rem;font-size:1rem;display:flex;align-items:center;gap:.75rem;transition:border-color .12s,background .12s}
.opt:hover:not([disabled]){border-color:var(--accent);background:var(--accent-soft)}
.opt .key{width:26px;height:26px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;font-weight:700;font-size:.85rem;flex:none}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.correct .key{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.mark{margin-left:auto;font-weight:700;font-size:.85rem}
.opt.correct .mark{color:var(--good)} .opt.wrong .mark{color:var(--bad)}

.analysis{margin-top:1.2rem;border-radius:14px;padding:1.1rem 1.2rem;animation:fade .3s ease}
.analysis.ok{background:var(--good-soft);border:1px solid color-mix(in srgb,var(--good) 35%,transparent)}
.analysis.no{background:var(--bad-soft);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent)}
.analysis .verdict{font-family:var(--serif);font-size:1.12rem;font-weight:600;display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem}
.analysis.ok .verdict{color:var(--good)} .analysis.no .verdict{color:var(--bad)}
.analysis p{margin:.4rem 0;font-size:.93rem}
.analysis .row{margin:.55rem 0;font-size:.92rem}
.analysis .row b{color:var(--ink)}
.analysis .why-wrong{background:color-mix(in srgb,var(--bad) 8%,transparent);border-radius:8px;padding:.5rem .7rem;font-size:.88rem;margin-top:.5rem}
.analysis .tip{font-size:.88rem;color:var(--ink-soft);margin-top:.6rem;padding-top:.6rem;border-top:1px dashed var(--line)}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-top:1.4rem;flex-wrap:wrap}
.locked-note{font-size:.84rem;color:var(--ink-soft);display:flex;align-items:center;gap:.4rem}

/* ---- results ---- */
.result{text-align:center;max-width:560px;margin:0 auto}
.score-ring{width:170px;height:170px;margin:1rem auto 1.3rem;position:relative}
.score-ring svg{transform:rotate(-90deg)}
.score-ring .pct{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.score-ring .pct b{font-family:var(--serif);font-size:2.5rem;line-height:1;display:block}
.score-ring .pct span{font-size:.78rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.verdict-big{font-family:var(--serif);font-size:1.5rem;margin-bottom:.5rem}
.result .sub{color:var(--ink-soft);margin-bottom:1.5rem}
.breakdown{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:.4rem;margin:1.3rem 0;box-shadow:var(--shadow)}
.brow{display:flex;align-items:center;gap:.8rem;padding:.7rem .8rem;border-radius:10px}
.brow+.brow{border-top:1px solid var(--line)}
.brow .n{font-weight:600;flex:1}
.brow .sc{font-variant-numeric:tabular-nums;font-weight:700}
.brow .pill{font-size:.72rem;font-weight:700;padding:.2em .6em;border-radius:999px}
.pill.pass{background:var(--good-soft);color:var(--good)}
.pill.fail{background:var(--bad-soft);color:var(--bad)}
.actions{display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap;margin-top:.5rem}
.mini{font-size:.8rem;color:var(--ink-soft);margin-top:1.2rem}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
footer.ft{text-align:center;color:var(--ink-soft);font-size:.78rem;padding:2rem 0 1rem}
</style>

<script>

/* 6 topics × 10 items. Each: w(word) p(part) ipa, en(def) vi(gloss) eg(example, **target**) col(collocations) */

{ id:"env", name:"Environment & Climate", tag:"Topic 1",
  cards:[

  {w:"depletion",p:"noun",ipa:"/dɪˈpliːʃn/",en:"the reduction of something, especially a natural resource, to a dangerously low level",vi:"sự cạn kiệt",eg:"The rapid **depletion** of groundwater threatens farming across the region.",col:["resource depletion","ozone depletion"]},

  {w:"emissions",p:"noun",ipa:"/ɪˈmɪʃnz/",en:"gases, especially carbon dioxide, released into the air",vi:"khí thải",eg:"The new law aims to cut factory **emissions** by half.",col:["cut emissions","greenhouse gas emissions"]},
  {w:"deforestation",p:"noun",ipa:"/ˌdiːˌfɒrɪˈsteɪʃn/",en:"the clearing of forests on a large scale",vi:"nạn phá rừng",eg:"**Deforestation** destroys the habitats of countless species.",col:["widespread deforestation","tackle deforestation"]},

  {w:"to conserve",p:"verb",ipa:"/kənˈsɜːv/",en:"to protect something and use it carefully so it is not wasted",vi:"bảo tồn, tiết kiệm",eg:"Simple habits can help us **conserve** water at home.",col:["conserve energy","conserve resources"]},
  {w:"greenhouse gas",p:"noun",ipa:"/ˈɡriːnhaʊs ɡæs/",en:"a gas such as carbon dioxide that traps heat in the atmosphere",vi:"khí nhà kính",eg:"Methane is a particularly powerful **greenhouse gas**.",col:["greenhouse gas emissions","cut greenhouse gases"]},
  {w:"detrimental",p:"adjective",ipa:"/ˌdetrɪˈmentl/",en:"harmful; causing damage",vi:"có hại, gây tổn hại",eg:"Plastic waste has a **detrimental** effect on marine life.",col:["detrimental to health","a detrimental impact"]},
  {w:"to phase out",p:"phrasal verb",ipa:"/feɪz aʊt/",en:"to stop using something gradually over time",vi:"loại bỏ dần",eg:"The government plans to **phase out** petrol cars by 2035.",col:["phase out fossil fuels","gradually phase out"]},
  {w:"contamination",p:"noun",ipa:"/kənˌtæmɪˈneɪʃn/",en:"the process of making something dirty or poisonous",vi:"sự nhiễm bẩn, ô nhiễm",eg:"Chemical **contamination** has made the water unsafe to drink.",col:["water contamination","soil contamination"]},
  {w:"extinction",p:"noun",ipa:"/ɪkˈstɪŋkʃn/",en:"the state of a species no longer existing",vi:"sự tuyệt chủng",eg:"Overhunting drove the species to **extinction**.",col:["face extinction","on the verge of extinction"]},
  {w:"to preserve",p:"verb",ipa:"/prɪˈzɜːv/",en:"to keep something in its original state and protect it",vi:"bảo tồn, gìn giữ",eg:"We must **preserve** the rainforest for future generations.",col:["preserve nature","preserve wildlife"]},
  {w:"waste",p:"noun",ipa:"/weɪst/",en:"unwanted material that is thrown away",vi:"rác thải",eg:"The city produces tonnes of **waste** every single day.",col:["household waste","reduce waste"]},
  {w:"flooding",p:"noun",ipa:"/ˈflʌdɪŋ/",en:"an overflow of water onto land that is normally dry",vi:"ngập lụt",eg:"Days of heavy rain caused severe **flooding**.",col:["cause flooding","flash flooding"]},
  {w:"to pollute",p:"verb",ipa:"/pəˈluːt/",en:"to make air, water or land dirty and harmful",vi:"làm ô nhiễm",eg:"Factories **pollute** the river with chemicals.",col:["pollute the air","heavily polluted"]},
  {w:"erosion",p:"noun",ipa:"/ɪˈrəʊʒn/",en:"the gradual wearing away of land by wind or water",vi:"sự xói mòn",eg:"Deforestation leads to serious soil **erosion**.",col:["soil erosion","coastal erosion"]},
  {w:"green",p:"adjective",ipa:"/ɡriːn/",en:"relating to or concerned with protecting the environment",vi:"thân thiện với môi trường",eg:"The company promotes **green** energy and recycling.",col:["green energy","go green"]},
  {w:"to reduce",p:"verb",ipa:"/rɪˈdjuːs/",en:"to make something smaller in amount, size or degree",vi:"giảm thiểu",eg:"We should all try to **reduce** our use of plastic.",col:["reduce waste","reduce consumption"]},
  {w:"to restore",p:"verb",ipa:"/rɪˈstɔː/",en:"to bring something back to its former good condition",vi:"khôi phục, phục hồi",eg:"Efforts are underway to **restore** the damaged wetlands.",col:["restore habitats","restore balance"]},
  ]},
{ id:"work", name:"Work & Careers", tag:"Topic 2",
  cards:[
  {w:"recruitment",p:"noun",ipa:"/rɪˈkruːtmənt/",en:"the process of finding and hiring new people to work for an organisation",vi:"sự tuyển dụng",eg:"The firm has streamlined its **recruitment** process to hire faster.",col:["recruitment process","graduate recruitment"]},
  {w:"to pursue a career",p:"phrase",ipa:"/pəˈsjuː ə kəˈrɪə/",en:"to work towards a particular profession over time",vi:"theo đuổi sự nghiệp",eg:"She left teaching to **pursue a career** in software design.",col:["pursue a career in","a rewarding career"]},
  {w:"demanding",p:"adjective",ipa:"/dɪˈmɑːndɪŋ/",en:"needing a lot of time, effort, skill or attention",vi:"đòi hỏi cao, vất vả",eg:"Nursing is a **demanding** job, both physically and emotionally.",col:["a demanding role","intellectually demanding"]},
  {w:"to climb the ladder",p:"idiom",ipa:"/klaɪm ðə ˈlædə/",en:"to gradually rise to more senior and better-paid positions",vi:"thăng tiến trong sự nghiệp",eg:"He worked weekends for years to **climb the ladder** at the bank.",col:["climb the corporate ladder","the career ladder"]},
  {w:"redundant",p:"adjective",ipa:"/rɪˈdʌndənt/",en:"no longer employed because the job is no longer needed",vi:"bị dư thừa, bị cho thôi việc",eg:"Three hundred staff were made **redundant** when the plant closed.",col:["made redundant","redundancy pay"]},
  {w:"work–life balance",p:"noun",ipa:"/wɜːk laɪf ˈbæləns/",en:"the healthy division of time between your job and your personal life",vi:"cân bằng công việc – cuộc sống",eg:"Remote work has improved the **work–life balance** of many employees.",col:["a healthy work–life balance","maintain work–life balance"]},
  {w:"to take on",p:"phrasal verb",ipa:"/teɪk ɒn/",en:"to accept a task or responsibility; to hire someone",vi:"đảm nhận; tuyển thêm",eg:"The team **took on** two interns to cope with the extra workload.",col:["take on responsibility","take on new staff"]},
  {w:"expertise",p:"noun",ipa:"/ˌekspɜːˈtiːz/",en:"deep skill or knowledge in a particular field",vi:"chuyên môn, sự tinh thông",eg:"We hired her for her **expertise** in data security.",col:["technical expertise","draw on expertise"]},
  {w:"to be snowed under",p:"idiom",ipa:"/snəʊd ˈʌndə/",en:"to have far more work than you can easily handle",vi:"ngập đầu trong công việc",eg:"I can't meet today — I'm completely **snowed under** with reports.",col:["snowed under with work"]},
  {w:"incentive",p:"noun",ipa:"/ɪnˈsentɪv/",en:"something that encourages a person to work harder or do something",vi:"động lực, sự khích lệ",eg:"Bonuses act as a strong **incentive** to hit sales targets.",col:["financial incentive","offer an incentive"]},
  {w:"CV (résumé)",p:"noun",ipa:"/ˌsiːˈviː/",en:"a document listing your education and work experience for job applications",vi:"sơ yếu lý lịch",eg:"Tailor your **CV** to each job you apply for.",col:["update your CV","a strong CV"]},
  {w:"to apply for",p:"phrasal verb",ipa:"/əˈplaɪ fɔː/",en:"to formally ask for a job, usually in writing",vi:"nộp đơn xin (việc)",eg:"She **applied for** three positions last week.",col:["apply for a job","apply for a post"]},
  {w:"promotion",p:"noun",ipa:"/prəˈməʊʃn/",en:"a move to a more senior, better-paid job",vi:"sự thăng chức",eg:"He was given a **promotion** after only a year.",col:["earn a promotion","a well-deserved promotion"]},
  {w:"workload",p:"noun",ipa:"/ˈwɜːkləʊd/",en:"the amount of work a person has to do",vi:"khối lượng công việc",eg:"My **workload** has doubled since the merger.",col:["a heavy workload","manage your workload"]},
  {w:"colleague",p:"noun",ipa:"/ˈkɒliːɡ/",en:"a person you work with",vi:"đồng nghiệp",eg:"I get on well with my **colleagues**.",col:["a close colleague","a former colleague"]},
  {w:"to meet a deadline",p:"phrase",ipa:"/miːt ə ˈdedlaɪn/",en:"to finish work by the required time",vi:"kịp thời hạn",eg:"We stayed late to **meet the deadline**.",col:["meet a tight deadline","miss a deadline"]},
  {w:"self-employed",p:"adjective",ipa:"/ˌself ɪmˈplɔɪd/",en:"working for yourself rather than for an employer",vi:"tự kinh doanh, làm tự do",eg:"Since going **self-employed**, she sets her own hours.",col:["become self-employed","self-employed workers"]},
  {w:"a steep learning curve",p:"idiom",ipa:"/stiːp ˈlɜːnɪŋ kɜːv/",en:"a situation where you have to learn a great deal very quickly",vi:"quá trình học hỏi vất vả, dốc",eg:"The first month in the role was a **steep learning curve**.",col:["face a steep learning curve"]},
  {w:"motivated",p:"adjective",ipa:"/ˈməʊtɪveɪtɪd/",en:"eager and willing to work hard",vi:"có động lực",eg:"Employers look for **motivated** team players.",col:["highly motivated","self-motivated"]},
  {w:"perk",p:"noun",ipa:"/pɜːk/",en:"an extra benefit given with a job",vi:"phúc lợi, đãi ngộ thêm",eg:"Free gym membership is one of the **perks** of the job.",col:["perks of the job","generous perks"]},
  {w:"to be laid off",p:"phrase",ipa:"/leɪd ɒf/",en:"to lose your job because there is not enough work",vi:"bị cho nghỉ việc (do cắt giảm)",eg:"Hundreds were **laid off** when demand fell.",col:["be laid off","lay off staff"]},
  {w:"shift",p:"noun",ipa:"/ʃɪft/",en:"a set period of working time",vi:"ca làm việc",eg:"Nurses often have to work a night **shift**.",col:["work a shift","shift work"]},
  {w:"qualifications",p:"noun",ipa:"/ˌkwɒlɪfɪˈkeɪʃnz/",en:"official records of training or exams you have passed",vi:"bằng cấp, chứng chỉ",eg:"The role requires formal teaching **qualifications**.",col:["relevant qualifications","gain qualifications"]},
  {w:"to juggle",p:"verb",ipa:"/ˈdʒʌɡl/",en:"to manage several tasks or responsibilities at the same time",vi:"xoay xở nhiều việc cùng lúc",eg:"She **juggles** a full-time job and two children.",col:["juggle responsibilities","juggle work and family"]},
  {w:"rewarding",p:"adjective",ipa:"/rɪˈwɔːdɪŋ/",en:"giving a satisfying sense of worth, even if not money",vi:"đáng giá, mãn nguyện",eg:"Teaching is demanding but deeply **rewarding**.",col:["a rewarding career","emotionally rewarding"]},
  {w:"to delegate",p:"verb",ipa:"/ˈdelɪɡeɪt/",en:"to give part of your work or power to someone else",vi:"giao việc, phân công",eg:"Good managers **delegate** tasks instead of doing everything.",col:["delegate tasks","delegate responsibility"]},
  {w:"prospects",p:"noun",ipa:"/ˈprɒspekts/",en:"chances of future success or promotion",vi:"triển vọng (nghề nghiệp)",eg:"The job offers excellent career **prospects**.",col:["career prospects","good prospects"]},
  {w:"burnout",p:"noun",ipa:"/ˈbɜːnaʊt/",en:"extreme tiredness caused by working too hard for too long",vi:"kiệt sức (do làm việc)",eg:"Long hours led to complete **burnout**.",col:["suffer burnout","avoid burnout"]},
  {w:"to stand out",p:"phrasal verb",ipa:"/stænd aʊt/",en:"to be clearly better or more noticeable than others",vi:"nổi bật",eg:"Volunteering helps your application **stand out**.",col:["stand out from the crowd","really stand out"]},
  {w:"salary",p:"noun",ipa:"/ˈsæləri/",en:"a fixed amount of money paid regularly for a job",vi:"lương (tháng/năm)",eg:"They offered a competitive **salary** and benefits.",col:["a competitive salary","an annual salary"]},
  {w:"candidate",p:"noun",ipa:"/ˈkændɪdət/",en:"a person who applies for a job or position",vi:"ứng viên",eg:"They interviewed five **candidates** for the post.",col:["a strong candidate","the ideal candidate"]},
  {w:"to resign",p:"verb",ipa:"/rɪˈzaɪn/",en:"to officially leave a job or position",vi:"từ chức, xin nghỉ việc",eg:"She **resigned** after a dispute with management.",col:["resign from a job","resign in protest"]},
  {w:"workforce",p:"noun",ipa:"/ˈwɜːkfɔːs/",en:"all the people who work in a company or country",vi:"lực lượng lao động",eg:"Half the **workforce** now works remotely.",col:["a skilled workforce","the entire workforce"]},
  {w:"teamwork",p:"noun",ipa:"/ˈtiːmwɜːk/",en:"the combined, cooperative effort of a group",vi:"làm việc nhóm",eg:"Good **teamwork** is vital in a busy kitchen.",col:["effective teamwork","rely on teamwork"]},
  {w:"to supervise",p:"verb",ipa:"/ˈsuːpəvaɪz/",en:"to watch over and direct work or people",vi:"giám sát",eg:"She **supervises** a team of ten engineers.",col:["supervise staff","closely supervise"]},
  {w:"overtime",p:"noun",ipa:"/ˈəʊvətaɪm/",en:"time worked beyond your normal working hours",vi:"giờ làm thêm",eg:"He earns extra money by working **overtime**.",col:["work overtime","paid overtime"]},
  {w:"a vacancy",p:"noun",ipa:"/ˈveɪkənsi/",en:"a job that is available for someone to take",vi:"vị trí tuyển dụng còn trống",eg:"The firm advertised three **vacancies** online.",col:["fill a vacancy","a job vacancy"]},
  {w:"competent",p:"adjective",ipa:"/ˈkɒmpɪtənt/",en:"having enough skill or ability to do something well",vi:"có năng lực",eg:"She is a highly **competent** project manager.",col:["a competent worker","technically competent"]},
  {w:"to earn a living",p:"phrase",ipa:"/ɜːn ə ˈlɪvɪŋ/",en:"to make the money you need in order to live",vi:"kiếm sống",eg:"He **earns a living** as a freelance photographer.",col:["earn a decent living"]},
  {w:"flexible",p:"adjective",ipa:"/ˈfleksəbl/",en:"able to change easily to suit different conditions",vi:"linh hoạt",eg:"Many staff prefer **flexible** working hours.",col:["flexible hours","a flexible schedule"]},
  ]},
{ id:"tech", name:"Technology & Media", tag:"Topic 3",
  cards:[
  {w:"cutting-edge",p:"adjective",ipa:"/ˌkʌtɪŋ ˈedʒ/",en:"extremely modern and advanced; at the forefront of development",vi:"tối tân, tiên tiến nhất",eg:"The lab is equipped with **cutting-edge** medical scanners.",col:["cutting-edge technology","cutting-edge research"]},
  {w:"to keep up with",p:"phrasal verb",ipa:"/kiːp ʌp wɪð/",en:"to stay informed about or at the same level as rapid change",vi:"theo kịp, bắt kịp",eg:"It's hard to **keep up with** the pace of technological change.",col:["keep up with the trends","keep up with the times"]},
  {w:"user-friendly",p:"adjective",ipa:"/ˌjuːzə ˈfrendli/",en:"easy and pleasant for ordinary people to use",vi:"dễ sử dụng",eg:"The app became popular because the interface is so **user-friendly**.",col:["a user-friendly design","user-friendly interface"]},
  {w:"to roll out",p:"phrasal verb",ipa:"/rəʊl aʊt/",en:"to introduce a new product or service gradually and widely",vi:"triển khai, tung ra",eg:"The network plans to **roll out** 5G coverage to rural areas next year.",col:["roll out a new feature","a nationwide roll-out"]},
  {w:"addictive",p:"adjective",ipa:"/əˈdɪktɪv/",en:"causing a strong, often harmful, need to keep doing something",vi:"gây nghiện",eg:"Social media is designed to be **addictive**, pulling users back repeatedly.",col:["highly addictive","addictive by design"]},
  {w:"to automate",p:"verb",ipa:"/ˈɔːtəmeɪt/",en:"to make a process work by machines or computers instead of people",vi:"tự động hóa",eg:"Factories increasingly **automate** repetitive tasks to cut costs.",col:["automate a process","fully automated"]},
  {w:"breakthrough",p:"noun",ipa:"/ˈbreɪkθruː/",en:"an important and sudden development or discovery",vi:"bước đột phá",eg:"The vaccine was hailed as a major scientific **breakthrough**.",col:["a major breakthrough","a breakthrough in"]},
  {w:"to be glued to",p:"idiom",ipa:"/ɡluːd tuː/",en:"to give something your complete, continuous attention (often a screen)",vi:"dán mắt vào",eg:"The children were **glued to** their tablets all afternoon.",col:["glued to the screen"]},
  {w:"reliable",p:"adjective",ipa:"/rɪˈlaɪəbl/",en:"able to be trusted to work well or give accurate results",vi:"đáng tin cậy",eg:"Users want a device that is fast, affordable and **reliable**.",col:["a reliable source","highly reliable"]},
  {w:"to revolutionise",p:"verb",ipa:"/ˌrevəˈluːʃənaɪz/",en:"to change something completely and for the better",vi:"cách mạng hóa",eg:"Smartphones have **revolutionised** the way we communicate.",col:["revolutionise the industry","completely revolutionise"]},
  {w:"artificial intelligence",p:"noun",ipa:"/ˌɑːtɪˈfɪʃl ɪnˈtelɪdʒəns/",en:"computer systems able to perform tasks that normally need human thinking",vi:"trí tuệ nhân tạo",eg:"**Artificial intelligence** is transforming healthcare and finance.",col:["advances in artificial intelligence","AI-powered tools"]},
  {w:"device",p:"noun",ipa:"/dɪˈvaɪs/",en:"a piece of equipment made for a particular purpose, such as a phone",vi:"thiết bị",eg:"People check their **devices** dozens of times a day.",col:["a handheld device","mobile devices"]},
  {w:"to browse",p:"verb",ipa:"/braʊz/",en:"to look through websites or information in a relaxed way",vi:"lướt web, duyệt",eg:"I **browse** the news on my phone each morning.",col:["browse the internet","browse online"]},
  {w:"innovation",p:"noun",ipa:"/ˌɪnəˈveɪʃn/",en:"a new idea, method or product",vi:"sự đổi mới, cải tiến",eg:"The firm is known for constant **innovation**.",col:["technological innovation","drive innovation"]},
  {w:"screen time",p:"noun",ipa:"/ˈskriːn taɪm/",en:"the amount of time spent looking at a screen",vi:"thời gian dùng màn hình",eg:"Parents worry about their children's **screen time**.",col:["limit screen time","excessive screen time"]},
  {w:"obsolete",p:"adjective",ipa:"/ˈɒbsəliːt/",en:"no longer used because something newer has replaced it",vi:"lỗi thời, lạc hậu",eg:"Smartphones have made many older gadgets **obsolete**.",col:["become obsolete","technically obsolete"]},
  {w:"data",p:"noun",ipa:"/ˈdeɪtə/",en:"information, especially facts collected and stored by computers",vi:"dữ liệu",eg:"Companies collect huge amounts of personal **data**.",col:["store data","data privacy"]},
  {w:"to upgrade",p:"verb",ipa:"/ˌʌpˈɡreɪd/",en:"to replace something with a newer, better version",vi:"nâng cấp",eg:"I need to **upgrade** my laptop's memory.",col:["upgrade a system","a free upgrade"]},
  {w:"convenient",p:"adjective",ipa:"/kənˈviːniənt/",en:"easy and useful; saving you time and effort",vi:"tiện lợi",eg:"Online banking is incredibly **convenient**.",col:["quick and convenient","a convenient option"]},
  {w:"gadget",p:"noun",ipa:"/ˈɡædʒɪt/",en:"a small, clever electronic tool or machine",vi:"thiết bị nhỏ, đồ công nghệ",eg:"He loves buying the latest **gadgets**.",col:["the latest gadgets","a handy gadget"]},
  {w:"to crash",p:"verb",ipa:"/kræʃ/",en:"(of a computer or program) to stop working suddenly",vi:"bị treo, sập (máy/phần mềm)",eg:"My laptop **crashed** before I could save the file.",col:["the system crashed","the app keeps crashing"]},
  {w:"cyberbullying",p:"noun",ipa:"/ˈsaɪbəˌbʊliɪŋ/",en:"the act of bullying someone using the internet",vi:"bắt nạt trên mạng",eg:"Schools are working hard to tackle **cyberbullying**.",col:["a victim of cyberbullying","tackle cyberbullying"]},
  {w:"streaming",p:"noun",ipa:"/ˈstriːmɪŋ/",en:"watching or listening to media over the internet in real time",vi:"phát trực tuyến",eg:"**Streaming** has largely replaced DVDs.",col:["a streaming service","music streaming"]},
  {w:"to go viral",p:"phrase",ipa:"/ɡəʊ ˈvaɪrəl/",en:"to spread very quickly to many people online",vi:"lan truyền chóng mặt",eg:"The short clip **went viral** overnight.",col:["go viral online","a viral video"]},
  {w:"digital",p:"adjective",ipa:"/ˈdɪdʒɪtl/",en:"using computer technology, especially the internet",vi:"kỹ thuật số",eg:"We now live in a **digital** age.",col:["digital technology","the digital world"]},
  {w:"to hack",p:"verb",ipa:"/hæk/",en:"to break into a computer system illegally",vi:"tấn công, xâm nhập (máy tính)",eg:"Criminals **hacked** into the bank's database.",col:["hack an account","get hacked"]},
  {w:"password",p:"noun",ipa:"/ˈpɑːswɜːd/",en:"a secret word or phrase that lets you access an account",vi:"mật khẩu",eg:"Always use a strong, unique **password**.",col:["a strong password","reset your password"]},
  {w:"seamless",p:"adjective",ipa:"/ˈsiːmləs/",en:"smooth and continuous, with no awkward gaps or problems",vi:"liền mạch, mượt mà",eg:"The app offers a **seamless** user experience.",col:["a seamless experience","seamless integration"]},
  {w:"to multitask",p:"verb",ipa:"/ˌmʌltiˈtɑːsk/",en:"to do several things at the same time",vi:"làm nhiều việc cùng lúc",eg:"Phones let us **multitask**, but they can harm focus.",col:["the ability to multitask"]},
  {w:"subscription",p:"noun",ipa:"/səbˈskrɪpʃn/",en:"a payment made to use a service regularly",vi:"gói đăng ký (thuê bao)",eg:"I pay a monthly **subscription** for the app.",col:["a monthly subscription","cancel a subscription"]},
  {w:"app",p:"noun",ipa:"/æp/",en:"a program designed to run on a phone or computer",vi:"ứng dụng",eg:"There's an **app** for almost everything these days.",col:["download an app","a mobile app"]},
  {w:"to download",p:"verb",ipa:"/ˌdaʊnˈləʊd/",en:"to copy data from the internet onto a device",vi:"tải xuống",eg:"You can **download** the file for free.",col:["download an app","download content"]},
  {w:"network",p:"noun",ipa:"/ˈnetwɜːk/",en:"a group of connected computers, systems or people",vi:"mạng lưới",eg:"The company's **network** went down for hours.",col:["a social network","a computer network"]},
  {w:"to malfunction",p:"verb",ipa:"/ˌmælˈfʌŋkʃn/",en:"to fail to work in the correct way",vi:"trục trặc, hỏng hóc",eg:"The sensor began to **malfunction** without warning.",col:["the system malfunctioned"]},
  {w:"privacy",p:"noun",ipa:"/ˈprɪvəsi/",en:"the state of keeping your personal information secret",vi:"quyền riêng tư",eg:"Users increasingly worry about online **privacy**.",col:["data privacy","protect your privacy"]},
  {w:"to replace",p:"verb",ipa:"/rɪˈpleɪs/",en:"to take the place of something or someone else",vi:"thay thế",eg:"Robots may **replace** many factory workers.",col:["replace workers","replace with"]},
  {w:"efficient",p:"adjective",ipa:"/ɪˈfɪʃnt/",en:"working well without wasting time, money or energy",vi:"hiệu quả",eg:"The new system is far more **efficient** than the old one.",col:["energy-efficient","highly efficient"]},
  {w:"a glitch",p:"noun",ipa:"/ɡlɪtʃ/",en:"a small, sudden fault in a system or machine",vi:"lỗi nhỏ, trục trặc",eg:"A software **glitch** delayed the launch.",col:["a technical glitch","a minor glitch"]},
  {w:"to connect",p:"verb",ipa:"/kəˈnekt/",en:"to join to a network or to link with other people",vi:"kết nối",eg:"The app lets you **connect** with friends worldwide.",col:["connect to the internet","stay connected"]},
  {w:"wireless",p:"adjective",ipa:"/ˈwaɪələs/",en:"working without the need for connecting wires",vi:"không dây",eg:"Most homes now rely on **wireless** internet.",col:["a wireless network","wireless devices"]},
  ]},
{ id:"edu", name:"Education", tag:"Topic 4",
  cards:[

  {w:"to enrol",p:"verb",ipa:"/ɪnˈrəʊl/",en:"to officially join a course or school",vi:"ghi danh, nhập học",eg:"Thousands **enrol** on online courses each year.",col:["enrol on a course","enrol at a university"]},

  {w:"academic",p:"adjective",ipa:"/ˌækəˈdemɪk/",en:"relating to study and education, especially at a higher level",vi:"thuộc về học thuật",eg:"He has a strong **academic** record.",col:["academic achievement","academic performance"]},

  {w:"literacy",p:"noun",ipa:"/ˈlɪtərəsi/",en:"the ability to read and write",vi:"khả năng đọc viết",eg:"Improving **literacy** is a national priority.",col:["literacy rates","adult literacy"]},
  {w:"mature student",p:"noun",ipa:"/məˈtjʊə ˈstjuːdnt/",en:"an older student, usually over 21, returning to study",vi:"sinh viên lớn tuổi (học muộn)",eg:"As a **mature student**, he brought real-world experience to class.",col:["a mature student"]},

  {w:"to foster",p:"verb",ipa:"/ˈfɒstə/",en:"to encourage the development of a skill or quality",vi:"nuôi dưỡng, thúc đẩy",eg:"Group projects **foster** teamwork and communication.",col:["foster creativity","foster independence"]},
  {w:"discipline",p:"noun",ipa:"/ˈdɪsəplɪn/",en:"controlled, orderly behaviour and self-control",vi:"tính kỷ luật",eg:"Studying alone requires a lot of **discipline**.",col:["self-discipline","strict discipline"]},
  {w:"extracurricular",p:"adjective",ipa:"/ˌekstrəkəˈrɪkjələ/",en:"describing activities done outside the normal lessons",vi:"ngoại khóa",eg:"Universities value **extracurricular** activities.",col:["extracurricular activities"]},
  {w:"to retain",p:"verb",ipa:"/rɪˈteɪn/",en:"to keep information in your memory",vi:"ghi nhớ, lưu giữ",eg:"We **retain** information better by testing ourselves.",col:["retain information","retain knowledge"]},
  {w:"vocational",p:"adjective",ipa:"/vəʊˈkeɪʃənl/",en:"relating to training for a particular job or trade",vi:"thuộc về dạy nghề",eg:"**Vocational** courses teach practical job skills.",col:["vocational training","a vocational qualification"]},
  {w:"to memorise",p:"verb",ipa:"/ˈmeməraɪz/",en:"to learn something so that you can remember it exactly",vi:"ghi nhớ, học thuộc",eg:"Students had to **memorise** long lists of dates.",col:["memorise facts","memorise vocabulary"]},

  {w:"degree",p:"noun",ipa:"/dɪˈɡriː/",en:"a qualification awarded by a university",vi:"bằng (đại học)",eg:"He earned a **degree** in economics.",col:["a university degree","a master's degree"]},
  {w:"to sit an exam",p:"phrase",ipa:"/sɪt ən ɪɡˈzæm/",en:"to take an examination",vi:"dự thi, làm bài thi",eg:"They **sit their exams** in June.",col:["sit a final exam"]},
  {w:"knowledge",p:"noun",ipa:"/ˈnɒlɪdʒ/",en:"information and understanding gained through learning",vi:"kiến thức",eg:"Reading widely builds your general **knowledge**.",col:["gain knowledge","in-depth knowledge"]},

  {w:"coursework",p:"noun",ipa:"/ˈkɔːswɜːk/",en:"work done during a course that counts towards a grade",vi:"bài tập, đồ án trên lớp",eg:"Half the mark comes from **coursework**.",col:["submit coursework","continuous coursework"]},

{ id:"health", name:"Health & Lifestyle", tag:"Topic 5",

  {w:"sedentary",p:"adjective",ipa:"/ˈsedntri/",en:"involving a lot of sitting and very little physical activity",vi:"ít vận động, ngồi nhiều",eg:"A **sedentary** lifestyle increases the risk of heart disease.",col:["a sedentary lifestyle","sedentary work"]},
  {w:"to take up",p:"phrasal verb",ipa:"/teɪk ʌp/",en:"to start doing a new activity or hobby regularly",vi:"bắt đầu (thói quen/sở thích)",eg:"My doctor suggested I **take up** swimming to ease my back pain.",col:["take up a hobby","take up running"]},
  {w:"well-being",p:"noun",ipa:"/ˌwelˈbiːɪŋ/",en:"the state of being comfortable, healthy and happy",vi:"sức khỏe & tinh thần (hạnh phúc)",eg:"Companies are investing more in the mental **well-being** of staff.",col:["mental well-being","sense of well-being"]},
  {w:"to cut down on",p:"phrasal verb",ipa:"/kʌt daʊn ɒn/",en:"to reduce the amount of something you consume or do",vi:"cắt giảm",eg:"I'm trying to **cut down on** sugar and processed food.",col:["cut down on salt","cut down on screen time"]},
  {w:"nutritious",p:"adjective",ipa:"/njuˈtrɪʃəs/",en:"containing substances that are good for your health and growth",vi:"bổ dưỡng, giàu dinh dưỡng",eg:"A **nutritious** breakfast helps children concentrate at school.",col:["a nutritious diet","nutritious meals"]},
  {w:"to be prone to",p:"phrase",ipa:"/prəʊn tuː/",en:"to be likely to suffer from or do something unwanted",vi:"dễ mắc (bệnh), dễ bị",eg:"People who skip sleep are more **prone to** illness.",col:["prone to injury","accident-prone"]},
  {w:"to recover",p:"verb",ipa:"/rɪˈkʌvə/",en:"to get back to a normal, healthy state after illness or difficulty",vi:"hồi phục",eg:"It took her a month to fully **recover** from the operation.",col:["recover from illness","a speedy recovery"]},
  {w:"stress-related",p:"adjective",ipa:"/ˈstres rɪˌleɪtɪd/",en:"caused by or connected to mental pressure and worry",vi:"liên quan đến căng thẳng",eg:"**Stress-related** conditions are on the rise among young workers.",col:["stress-related illness","stress-related absence"]},
  {w:"to boost",p:"verb",ipa:"/buːst/",en:"to increase or improve something, making it stronger",vi:"tăng cường, thúc đẩy",eg:"Regular exercise can **boost** both mood and immunity.",col:["boost your immune system","boost energy levels"]},
  {w:"in moderation",p:"phrase",ipa:"/ɪn ˌmɒdəˈreɪʃn/",en:"within sensible limits; not too much",vi:"điều độ, chừng mực",eg:"Most doctors agree that coffee is fine **in moderation**.",col:["eat in moderation","everything in moderation"]},
  {w:"balanced diet",p:"noun",ipa:"/ˌbælənst ˈdaɪət/",en:"eating the right variety and amount of different foods",vi:"chế độ ăn cân bằng",eg:"A **balanced diet** keeps your energy steady all day.",col:["eat a balanced diet","a healthy, balanced diet"]},
  {w:"to work out",p:"phrasal verb",ipa:"/wɜːk aʊt/",en:"to do physical exercise to keep fit",vi:"tập luyện thể dục",eg:"I **work out** at the gym three times a week.",col:["work out regularly","a hard workout"]},
  {w:"immune system",p:"noun",ipa:"/ɪˈmjuːn ˈsɪstəm/",en:"the body's natural defence against illness",vi:"hệ miễn dịch",eg:"Enough sleep strengthens your **immune system**.",col:["a strong immune system","weaken the immune system"]},
  {w:"obesity",p:"noun",ipa:"/əʊˈbiːsəti/",en:"the condition of being very overweight in a way that harms health",vi:"béo phì",eg:"Childhood **obesity** is rising sharply.",col:["tackle obesity","the obesity epidemic"]},
  {w:"symptom",p:"noun",ipa:"/ˈsɪmptəm/",en:"a sign that shows you have an illness",vi:"triệu chứng",eg:"A high fever is a common **symptom** of flu.",col:["show symptoms","mild symptoms"]},
  {w:"to ease",p:"verb",ipa:"/iːz/",en:"to make pain or a problem less severe",vi:"làm dịu, giảm bớt",eg:"Gentle stretching can **ease** back pain.",col:["ease the pain","ease symptoms"]},
  {w:"mental health",p:"noun",ipa:"/ˈmentl helθ/",en:"the condition of a person's mind and emotions",vi:"sức khỏe tinh thần",eg:"Exercise benefits both physical and **mental health**.",col:["mental health problems","poor mental health"]},
  {w:"to get into shape",p:"idiom",ipa:"/ɡet ˈɪntə ʃeɪp/",en:"to become physically fit",vi:"lấy lại vóc dáng, rèn luyện thể lực",eg:"He joined a gym to **get into shape** before summer.",col:["get back into shape"]},
  {w:"chronic",p:"adjective",ipa:"/ˈkrɒnɪk/",en:"(of an illness) lasting a very long time",vi:"mãn tính (bệnh)",eg:"She suffers from a **chronic** lung condition.",col:["a chronic illness","chronic pain"]},
  {w:"to burn off",p:"phrasal verb",ipa:"/bɜːn ɒf/",en:"to use up energy or calories through activity",vi:"tiêu hao (năng lượng/calo)",eg:"A brisk walk helps **burn off** extra calories.",col:["burn off calories","burn off energy"]},
  {w:"hygiene",p:"noun",ipa:"/ˈhaɪdʒiːn/",en:"keeping yourself and your surroundings clean to stay healthy",vi:"vệ sinh",eg:"Good **hygiene** prevents the spread of germs.",col:["personal hygiene","food hygiene"]},
  {w:"to put on weight",p:"phrase",ipa:"/pʊt ɒn weɪt/",en:"to become heavier",vi:"tăng cân",eg:"Many people **put on weight** over the winter months.",col:["put on weight","put on a few kilos"]},
  {w:"remedy",p:"noun",ipa:"/ˈremədi/",en:"a treatment or cure for an illness",vi:"phương thuốc, cách chữa",eg:"Honey is a popular **remedy** for a sore throat.",col:["a natural remedy","a home remedy"]},
  {w:"sleep deprivation",p:"noun",ipa:"/sliːp ˌdeprɪˈveɪʃn/",en:"the state of not getting enough sleep",vi:"sự thiếu ngủ",eg:"**Sleep deprivation** badly harms concentration.",col:["suffer sleep deprivation","chronic sleep deprivation"]},
  {w:"to maintain",p:"verb",ipa:"/meɪnˈteɪn/",en:"to keep something at the same good level",vi:"duy trì",eg:"It can be hard to **maintain** a healthy weight over time.",col:["maintain a healthy weight","maintain fitness"]},
  {w:"addiction",p:"noun",ipa:"/əˈdɪkʃn/",en:"being unable to stop using or doing something harmful",vi:"sự nghiện",eg:"Sugar **addiction** is a growing public concern.",col:["overcome addiction","a serious addiction"]},
  {w:"wholesome",p:"adjective",ipa:"/ˈhəʊlsəm/",en:"good for your health; healthy and natural",vi:"lành mạnh, bổ dưỡng",eg:"They cook simple, **wholesome** meals at home.",col:["wholesome food","wholesome ingredients"]},
  {w:"to be run down",p:"phrase",ipa:"/rʌn daʊn/",en:"tired and in poor health, usually from overwork",vi:"mệt mỏi, suy nhược",eg:"After exams I felt completely **run down**.",col:["feel run down"]},
  {w:"intake",p:"noun",ipa:"/ˈɪnteɪk/",en:"the amount of food, drink or a substance you take into your body",vi:"lượng (nạp vào cơ thể)",eg:"Doctors advise cutting your salt **intake**.",col:["daily intake","calorie intake"]},
  {w:"posture",p:"noun",ipa:"/ˈpɒstʃə/",en:"the way you hold your body when sitting or standing",vi:"tư thế",eg:"Poor **posture** at a desk can cause neck pain.",col:["good posture","poor posture"]},
  {w:"to diagnose",p:"verb",ipa:"/ˈdaɪəɡnəʊz/",en:"to identify an illness from its signs and symptoms",vi:"chẩn đoán",eg:"She was **diagnosed** with asthma as a child.",col:["diagnose a disease","early diagnosis"]},
  {w:"outbreak",p:"noun",ipa:"/ˈaʊtbreɪk/",en:"a sudden start of a disease affecting many people",vi:"sự bùng phát (dịch)",eg:"There was an **outbreak** of flu at the school.",col:["a disease outbreak","contain an outbreak"]},
  {w:"to prevent",p:"verb",ipa:"/prɪˈvent/",en:"to stop something from happening",vi:"ngăn ngừa",eg:"Vaccines **prevent** many serious diseases.",col:["prevent illness","prevent disease"]},
  {w:"fitness",p:"noun",ipa:"/ˈfɪtnəs/",en:"the condition of being physically healthy and strong",vi:"thể lực, sự sung sức",eg:"Regular running greatly improves your **fitness**.",col:["physical fitness","improve fitness"]},
  {w:"contagious",p:"adjective",ipa:"/kənˈteɪdʒəs/",en:"(of a disease) spreading easily from person to person",vi:"dễ lây lan",eg:"Measles is highly **contagious**.",col:["a contagious disease","highly contagious"]},
  {w:"to cope with",p:"phrasal verb",ipa:"/kəʊp wɪð/",en:"to deal successfully with a difficult situation",vi:"đương đầu, xoay sở với",eg:"She learned to **cope with** the stress of work.",col:["cope with pressure","cope with stress"]},
  {w:"painkiller",p:"noun",ipa:"/ˈpeɪnkɪlə/",en:"a drug that reduces or removes pain",vi:"thuốc giảm đau",eg:"He took a **painkiller** for his headache.",col:["take a painkiller","strong painkillers"]},
  {w:"to overcome",p:"verb",ipa:"/ˌəʊvəˈkʌm/",en:"to successfully deal with and defeat a problem",vi:"vượt qua, khắc phục",eg:"With therapy she **overcame** her fear of flying.",col:["overcome an illness","overcome difficulties"]},
  {w:"dehydration",p:"noun",ipa:"/ˌdiːhaɪˈdreɪʃn/",en:"the harmful loss of too much water from the body",vi:"sự mất nước",eg:"Drink regularly to avoid **dehydration**.",col:["cause dehydration","severe dehydration"]},
  {w:"vigorous",p:"adjective",ipa:"/ˈvɪɡərəs/",en:"strong, energetic and forceful",vi:"mạnh mẽ, hăng hái",eg:"**Vigorous** exercise strengthens the heart.",col:["vigorous exercise","vigorous activity"]},
  ]},
{ id:"cause", name:"Cause, Effect & Change", tag:"Topic 6",
  cards:[
  {w:"to trigger",p:"verb",ipa:"/ˈtrɪɡə/",en:"to cause something, especially a reaction or event, to start",vi:"gây ra, châm ngòi cho",eg:"The policy change **triggered** a wave of public protest.",col:["trigger a reaction","trigger a crisis"]},
  {w:"to stem from",p:"phrasal verb",ipa:"/stem frɒm/",en:"to be caused by or originate from something",vi:"bắt nguồn từ",eg:"Many of these problems **stem from** a lack of funding.",col:["stem from a cause","problems stemming from"]},
  {w:"repercussions",p:"noun",ipa:"/ˌriːpəˈkʌʃnz/",en:"the indirect and usually unpleasant results that follow an action",vi:"hậu quả, hệ lụy (gián tiếp)",eg:"The decision had serious financial **repercussions** for the region.",col:["far-reaching repercussions","serious repercussions"]},
  {w:"consequence",p:"noun",ipa:"/ˈkɒnsɪkwəns/",en:"a result or effect of an action or situation",vi:"hậu quả, kết quả",eg:"Job losses are a direct **consequence** of the factory closure.",col:["a direct consequence","face the consequences"]},
  {w:"to bring about",p:"phrasal verb",ipa:"/brɪŋ əˈbaʊt/",en:"to make something happen; to cause change",vi:"mang lại, tạo ra (sự thay đổi)",eg:"New technology has **brought about** huge changes in retail.",col:["bring about change","bring about reform"]},
  {w:"to exacerbate",p:"verb",ipa:"/ɪɡˈzæsəbeɪt/",en:"to make a bad situation even worse",vi:"làm trầm trọng thêm",eg:"Cutting staff only **exacerbated** the delays.",col:["exacerbate the problem","exacerbate tensions"]},
  {w:"to give rise to",p:"phrase",ipa:"/ɡɪv raɪz tuː/",en:"to cause something to happen or exist",vi:"làm nảy sinh, dẫn đến",eg:"The reforms **gave rise to** a new wave of entrepreneurship.",col:["give rise to concern","give rise to problems"]},
  {w:"substantial",p:"adjective",ipa:"/səbˈstænʃl/",en:"large in amount, size or importance",vi:"đáng kể, lớn",eg:"The project required a **substantial** investment of time and money.",col:["a substantial increase","substantial evidence"]},
  {w:"to undermine",p:"verb",ipa:"/ˌʌndəˈmaɪn/",en:"to gradually weaken something or make it less effective",vi:"làm suy yếu, phá hoại ngầm",eg:"Constant criticism can **undermine** a child's confidence.",col:["undermine confidence","undermine authority"]},
  {w:"a knock-on effect",p:"noun",ipa:"/ə ˈnɒk ɒn ɪˌfekt/",en:"an indirect result that causes other things to happen in turn",vi:"hiệu ứng dây chuyền",eg:"A delay at the port has a **knock-on effect** on shops nationwide.",col:["a knock-on effect on","have a knock-on effect"]},
  {w:"to result in",p:"phrase",ipa:"/rɪˈzʌlt ɪn/",en:"to cause a particular outcome to happen",vi:"dẫn đến (kết quả)",eg:"Heavy rain **resulted in** severe flooding downtown.",col:["result in damage","result in losses"]},
  {w:"to lead to",p:"phrase",ipa:"/liːd tuː/",en:"to cause something to happen, often over time",vi:"dẫn tới",eg:"A poor diet can **lead to** heart disease.",col:["lead to problems","lead to success"]},
  {w:"outcome",p:"noun",ipa:"/ˈaʊtkʌm/",en:"the final result of a process or event",vi:"kết quả (cuối cùng)",eg:"Nobody could predict the **outcome** of the talks.",col:["a positive outcome","the likely outcome"]},
  {w:"to contribute to",p:"phrase",ipa:"/kənˈtrɪbjuːt tuː/",en:"to be one of the causes of something",vi:"góp phần (gây ra)",eg:"Heavy traffic **contributes to** air pollution.",col:["contribute to a problem","contribute significantly"]},
  {w:"impact",p:"noun",ipa:"/ˈɪmpækt/",en:"a strong effect that something has on another thing",vi:"tác động",eg:"The policy had a huge **impact** on small firms.",col:["a significant impact","have an impact on"]},
  {w:"aftermath",p:"noun",ipa:"/ˈɑːftəmæθ/",en:"the period and effects that follow a bad event",vi:"hậu quả, giai đoạn sau (biến cố)",eg:"In the **aftermath** of the storm, thousands were homeless.",col:["in the aftermath of"]},
  {w:"to spark",p:"verb",ipa:"/spɑːk/",en:"to suddenly cause something to start",vi:"châm ngòi, khơi mào",eg:"The announcement **sparked** heated debate.",col:["spark a debate","spark controversy"]},
  {w:"inevitable",p:"adjective",ipa:"/ɪnˈevɪtəbl/",en:"certain to happen and impossible to avoid",vi:"không thể tránh khỏi",eg:"Some job losses were **inevitable** after the merger.",col:["an inevitable consequence","seemingly inevitable"]},
  {w:"significant",p:"adjective",ipa:"/sɪɡˈnɪfɪkənt/",en:"large or important enough to have a noticeable effect",vi:"đáng kể, quan trọng",eg:"There has been a **significant** rise in prices.",col:["a significant increase","a significant impact"]},
  {w:"gradual",p:"adjective",ipa:"/ˈɡrædʒuəl/",en:"happening slowly over a period of time",vi:"từ từ, dần dần",eg:"There was a **gradual** improvement in air quality.",col:["a gradual decline","gradual change"]},
  {w:"drastic",p:"adjective",ipa:"/ˈdræstɪk/",en:"extreme and sudden in effect",vi:"mạnh mẽ, quyết liệt",eg:"The crisis called for **drastic** measures.",col:["drastic measures","drastic change"]},
  {w:"to reverse",p:"verb",ipa:"/rɪˈvɜːs/",en:"to change something back to how it was before",vi:"đảo ngược",eg:"It may be too late to **reverse** the damage.",col:["reverse a decision","reverse a trend"]},
  {w:"widespread",p:"adjective",ipa:"/ˈwaɪdspred/",en:"happening over a large area or among many people",vi:"lan rộng, phổ biến",eg:"The reform met **widespread** criticism.",col:["widespread support","widespread damage"]},
  {w:"to escalate",p:"verb",ipa:"/ˈeskəleɪt/",en:"to become more serious or intense",vi:"leo thang, trầm trọng hơn",eg:"The dispute quickly **escalated** into a strike.",col:["escalate quickly","escalate into"]},
  {w:"a ripple effect",p:"noun",ipa:"/ə ˈrɪpl ɪˌfekt/",en:"a spreading series of indirect effects, one after another",vi:"hiệu ứng lan tỏa",eg:"One factory closure had a **ripple effect** across the town.",col:["a ripple effect","create a ripple effect"]},
  {w:"adverse",p:"adjective",ipa:"/ˈædvɜːs/",en:"negative, unfavourable and harmful",vi:"bất lợi, có hại",eg:"The drug has very few **adverse** effects.",col:["adverse effects","an adverse impact"]},
  {w:"to attribute to",p:"phrase",ipa:"/əˈtrɪbjuːt tuː/",en:"to say that something is caused by a particular thing",vi:"quy cho, cho là do",eg:"The decline was **attributed to** poor management.",col:["attribute the cause to","widely attributed to"]},
  {w:"consequently",p:"adverb",ipa:"/ˈkɒnsɪkwəntli/",en:"as a result of something",vi:"do đó, vì vậy",eg:"Sales fell sharply; **consequently**, staff were cut.",col:["and consequently"]},
  {w:"root cause",p:"noun",ipa:"/ruːt kɔːz/",en:"the basic, underlying reason for a problem",vi:"nguyên nhân gốc rễ",eg:"We must address the **root cause**, not just the symptoms.",col:["the root cause of","identify the root cause"]},
  {w:"to have an effect on",p:"phrase",ipa:"/hæv ən ɪˈfekt ɒn/",en:"to influence or change something",vi:"có ảnh hưởng đến",eg:"Stress can **have an effect on** the quality of your sleep.",col:["have a lasting effect on","have a direct effect on"]},
  {w:"to influence",p:"verb",ipa:"/ˈɪnfluəns/",en:"to affect how something develops or how someone behaves",vi:"ảnh hưởng",eg:"Advertising strongly **influences** what we buy.",col:["influence a decision","heavily influence"]},
  {w:"factor",p:"noun",ipa:"/ˈfæktə/",en:"one of the things that cause a particular result",vi:"yếu tố",eg:"Cost is a key **factor** in the decision.",col:["a major factor","a contributing factor"]},
  {w:"side effect",p:"noun",ipa:"/ˈsaɪd ɪˌfekt/",en:"an extra, often unwanted, result of something",vi:"tác dụng phụ, hệ quả phụ",eg:"The policy had an unexpected **side effect**.",col:["an unwanted side effect","a side effect of"]},
  {w:"to prompt",p:"verb",ipa:"/prɒmpt/",en:"to cause someone to do something, or cause a reaction",vi:"thúc đẩy, làm nảy sinh",eg:"The report **prompted** an immediate review.",col:["prompt a response","prompt action"]},
  {w:"severe",p:"adjective",ipa:"/sɪˈvɪə/",en:"very bad, serious or intense",vi:"nghiêm trọng",eg:"The storm caused **severe** damage to the coast.",col:["severe damage","a severe impact"]},
  {w:"to diminish",p:"verb",ipa:"/dɪˈmɪnɪʃ/",en:"to become or make smaller or less important",vi:"giảm sút, suy giảm",eg:"Public interest in the sport has **diminished** over time.",col:["diminish gradually","greatly diminish"]},
  {w:"a turning point",p:"noun",ipa:"/ə ˈtɜːnɪŋ pɔɪnt/",en:"a moment when an important change takes place",vi:"bước ngoặt",eg:"The election was a **turning point** for the country.",col:["a major turning point","mark a turning point"]},
  {w:"to accelerate",p:"verb",ipa:"/əkˈseləreɪt/",en:"to make something happen faster",vi:"thúc đẩy nhanh, tăng tốc",eg:"The crisis **accelerated** the shift to online work.",col:["accelerate change","accelerate growth"]},
  {w:"profound",p:"adjective",ipa:"/prəˈfaʊnd/",en:"very great or intense; far-reaching",vi:"sâu sắc, sâu rộng",eg:"Technology has had a **profound** effect on society.",col:["a profound effect","profound change"]},
  {w:"fluctuation",p:"noun",ipa:"/ˌflʌktʃuˈeɪʃn/",en:"an irregular rising and falling in number or amount",vi:"sự dao động, biến động",eg:"Price **fluctuations** worry many investors.",col:["price fluctuations","market fluctuations"]},
  ]},
{ id:"travel", name:"Travel & Tourism", tag:"Topic 7",
  cards:[
  {w:"destination",p:"noun",ipa:"/ˌdestɪˈneɪʃn/",en:"the place to which someone is travelling",vi:"điểm đến",eg:"Bali remains a top **destination** for honeymooners.",col:["a popular destination","a holiday destination"]},
  {w:"itinerary",p:"noun",ipa:"/aɪˈtɪnərəri/",en:"a planned route or schedule for a journey",vi:"lịch trình",eg:"Our tour **itinerary** covered three cities in five days.",col:["a packed itinerary","plan an itinerary"]},
  {w:"to embark on",p:"phrasal verb",ipa:"/ɪmˈbɑːk ɒn/",en:"to begin a journey or a new venture",vi:"bắt đầu (hành trình)",eg:"They **embarked on** a six-month trip across Asia.",col:["embark on a journey","embark on an adventure"]},
  {w:"accommodation",p:"noun",ipa:"/əˌkɒməˈdeɪʃn/",en:"a place to stay, such as a hotel or guesthouse",vi:"chỗ ở",eg:"We booked **accommodation** near the beach.",col:["budget accommodation","book accommodation"]},
  {w:"sightseeing",p:"noun",ipa:"/ˈsaɪtsiːɪŋ/",en:"visiting famous or interesting places as a tourist",vi:"tham quan",eg:"We spent the afternoon **sightseeing** in the old town.",col:["go sightseeing","a sightseeing tour"]},
  {w:"breathtaking",p:"adjective",ipa:"/ˈbreθteɪkɪŋ/",en:"extremely impressive or beautiful",vi:"ngoạn mục, đẹp sững sờ",eg:"The view from the summit was **breathtaking**.",col:["breathtaking scenery","breathtaking views"]},
  {w:"off the beaten track",p:"idiom",ipa:"/ɒf ðə ˈbiːtn træk/",en:"in a place far from where people usually go",vi:"nơi ít người lui tới",eg:"We prefer villages that are **off the beaten track**.",col:["somewhere off the beaten track"]},
  {w:"to commute",p:"verb",ipa:"/kəˈmjuːt/",en:"to travel regularly between home and work",vi:"đi lại (nhà–chỗ làm) hằng ngày",eg:"She **commutes** two hours to the office each day.",col:["commute to work","a long commute"]},
  {w:"jet lag",p:"noun",ipa:"/ˈdʒet læɡ/",en:"tiredness felt after a long flight across time zones",vi:"mệt do lệch múi giờ",eg:"It took me days to get over the **jet lag**.",col:["suffer from jet lag","bad jet lag"]},
  {w:"picturesque",p:"adjective",ipa:"/ˌpɪktʃəˈresk/",en:"charming and pretty, like a picture",vi:"đẹp như tranh",eg:"We stayed in a **picturesque** mountain village.",col:["a picturesque town","picturesque scenery"]},
  {w:"a package holiday",p:"noun",ipa:"/ə ˈpækɪdʒ ˈhɒlədeɪ/",en:"a trip with flights and hotel arranged together for one price",vi:"tour trọn gói",eg:"They booked a cheap **package holiday** to Spain.",col:["book a package holiday"]},
  {w:"landmark",p:"noun",ipa:"/ˈlændmɑːk/",en:"a famous or easily recognised building or place",vi:"địa danh nổi tiếng",eg:"The tower is the city's best-known **landmark**.",col:["a famous landmark","a historic landmark"]},
  {w:"to explore",p:"verb",ipa:"/ɪkˈsplɔː/",en:"to travel around a place in order to discover it",vi:"khám phá",eg:"We spent a week **exploring** the countryside.",col:["explore a region","explore new places"]},
  {w:"hospitality",p:"noun",ipa:"/ˌhɒspɪˈtæləti/",en:"friendly and generous treatment of guests",vi:"sự hiếu khách",eg:"The locals were known for their warm **hospitality**.",col:["warm hospitality","the hospitality industry"]},
  {w:"excursion",p:"noun",ipa:"/ɪkˈskɜːʃn/",en:"a short trip, usually for pleasure",vi:"chuyến đi ngắn, dã ngoại",eg:"The hotel offers day **excursions** to nearby islands.",col:["a day excursion","go on an excursion"]},
  {w:"to venture",p:"verb",ipa:"/ˈventʃə/",en:"to go somewhere that may be risky or unfamiliar",vi:"mạo hiểm đi tới",eg:"Few tourists **venture** beyond the main resorts.",col:["venture into","venture abroad"]},
  {w:"visa",p:"noun",ipa:"/ˈviːzə/",en:"official permission to enter a country",vi:"thị thực",eg:"You need a **visa** to travel there.",col:["apply for a visa","a tourist visa"]},
  {w:"remote",p:"adjective",ipa:"/rɪˈməʊt/",en:"far away from towns and from other people",vi:"hẻo lánh, xa xôi",eg:"They trekked to a **remote** mountain village.",col:["a remote area","remote islands"]},
  {w:"to soak up",p:"phrasal verb",ipa:"/səʊk ʌp/",en:"to enjoy and fully experience an atmosphere",vi:"tận hưởng (không khí)",eg:"We sat in the square to **soak up** the atmosphere.",col:["soak up the sun","soak up the atmosphere"]},
  {w:"backpacking",p:"noun",ipa:"/ˈbækpækɪŋ/",en:"travelling cheaply while carrying your things in a backpack",vi:"du lịch bụi",eg:"They went **backpacking** around South America.",col:["go backpacking"]},
  {w:"cultural heritage",p:"noun",ipa:"/ˈkʌltʃərəl ˈherɪtɪdʒ/",en:"traditions and monuments passed down over generations",vi:"di sản văn hóa",eg:"The city is rich in **cultural heritage**.",col:["preserve cultural heritage"]},
  {w:"souvenir",p:"noun",ipa:"/ˌsuːvəˈnɪə/",en:"an object kept to remember a place or trip",vi:"đồ lưu niệm",eg:"She bought a small **souvenir** from each country.",col:["buy a souvenir","a souvenir shop"]},
  {w:"bustling",p:"adjective",ipa:"/ˈbʌslɪŋ/",en:"full of energetic and noisy activity",vi:"nhộn nhịp, tấp nập",eg:"The **bustling** market was packed with vendors.",col:["a bustling city","bustling streets"]},
  {w:"to get away from it all",p:"idiom",ipa:"/ˈɡet əˌweɪ frəm ɪt ɔːl/",en:"to go on holiday to escape the stress of daily life",vi:"đi trốn khỏi bộn bề",eg:"A quiet beach is perfect to **get away from it all**.",col:["a chance to get away from it all"]},
  {w:"affordable",p:"adjective",ipa:"/əˈfɔːdəbl/",en:"not expensive; reasonably priced",vi:"giá cả phải chăng",eg:"The city has plenty of **affordable** hotels.",col:["affordable prices","an affordable option"]},
  {w:"to broaden the mind",p:"idiom",ipa:"/ˈbrɔːdn ðə maɪnd/",en:"(of travel) to make you more open and knowledgeable",vi:"mở mang đầu óc",eg:"They say that travel **broadens the mind**.",col:["travel broadens the mind"]},
  {w:"peak season",p:"noun",ipa:"/piːk ˈsiːzn/",en:"the busiest and most expensive time for travel",vi:"mùa cao điểm",eg:"Flights are far pricier during **peak season**.",col:["in peak season","the peak season"]},
  {w:"to cancel",p:"verb",ipa:"/ˈkænsl/",en:"to decide that a planned trip or booking will not happen",vi:"hủy (chuyến đi/đặt chỗ)",eg:"They had to **cancel** the flight because of the storm.",col:["cancel a booking","cancel a flight"]},
  {w:"scenery",p:"noun",ipa:"/ˈsiːnəri/",en:"the natural features of a landscape",vi:"phong cảnh",eg:"The train route offers stunning **scenery**.",col:["beautiful scenery","mountain scenery"]},
  {w:"wanderlust",p:"noun",ipa:"/ˈwɒndəlʌst/",en:"a strong desire to travel and see the world",vi:"máu xê dịch, đam mê du lịch",eg:"Her **wanderlust** has taken her to forty countries.",col:["a sense of wanderlust"]},
  {w:"tourist attraction",p:"noun",ipa:"/ˈtʊərɪst əˌtrækʃn/",en:"a place that people visit for interest or enjoyment",vi:"điểm thu hút du khách",eg:"The castle is the town's main **tourist attraction**.",col:["a popular tourist attraction"]},
  {w:"to book",p:"verb",ipa:"/bʊk/",en:"to arrange and pay for travel or a room in advance",vi:"đặt (vé/phòng)",eg:"We **booked** our flights months ahead.",col:["book a flight","book in advance"]},
  {w:"departure",p:"noun",ipa:"/dɪˈpɑːtʃə/",en:"the act of leaving to begin a journey",vi:"sự khởi hành",eg:"Our **departure** was delayed by thick fog.",col:["a departure time","a delayed departure"]},
  {w:"luggage",p:"noun",ipa:"/ˈlʌɡɪdʒ/",en:"the bags and cases a traveller carries",vi:"hành lý",eg:"Try to pack your **luggage** the night before.",col:["hand luggage","excess luggage"]},
  {w:"a getaway",p:"noun",ipa:"/ə ˈɡetəweɪ/",en:"a short holiday away from home",vi:"chuyến đi nghỉ ngắn",eg:"We booked a weekend **getaway** by the sea.",col:["a weekend getaway","a romantic getaway"]},
  {w:"to roam",p:"verb",ipa:"/rəʊm/",en:"to wander freely over a wide area",vi:"rong ruổi, lang thang",eg:"They love to **roam** the hills on foot.",col:["roam freely","roam the streets"]},
  {w:"vibrant",p:"adjective",ipa:"/ˈvaɪbrənt/",en:"full of energy, life and colour",vi:"sôi động, rực rỡ",eg:"The city is famous for its **vibrant** nightlife.",col:["a vibrant city","a vibrant culture"]},
  {w:"a stopover",p:"noun",ipa:"/ə ˈstɒpəʊvə/",en:"a short stay somewhere during a longer journey",vi:"điểm dừng chân",eg:"We had a two-day **stopover** in Dubai.",col:["a short stopover"]},
  {w:"to set off",p:"phrasal verb",ipa:"/set ˈɒf/",en:"to begin a journey",vi:"lên đường, khởi hành",eg:"We **set off** at dawn to beat the traffic.",col:["set off early","set off on a trip"]},
  {w:"memorable",p:"adjective",ipa:"/ˈmemərəbl/",en:"worth remembering; special and not easily forgotten",vi:"đáng nhớ",eg:"It was the most **memorable** trip of my life.",col:["a memorable experience","truly memorable"]},
  ]},
{ id:"crime", name:"Crime & Law", tag:"Topic 8",
  cards:[
  {w:"to commit a crime",p:"phrase",ipa:"/kəˈmɪt ə kraɪm/",en:"to do something illegal",vi:"phạm tội",eg:"He **committed a crime** and was later arrested.",col:["commit a serious crime","commit an offence"]},
  {w:"offender",p:"noun",ipa:"/əˈfendə/",en:"a person who has committed a crime",vi:"người phạm tội",eg:"Repeat **offenders** often receive harsher sentences.",col:["a first-time offender","a repeat offender"]},
  {w:"to deter",p:"verb",ipa:"/dɪˈtɜː/",en:"to discourage someone from doing something",vi:"răn đe, ngăn chặn",eg:"Harsher penalties may **deter** would-be criminals.",col:["deter crime","a deterrent effect"]},
  {w:"to convict",p:"verb",ipa:"/kənˈvɪkt/",en:"to find someone guilty of a crime in a court of law",vi:"kết tội",eg:"He was **convicted** of fraud.",col:["convict of a crime","a convicted criminal"]},
  {w:"sentence",p:"noun",ipa:"/ˈsentəns/",en:"the punishment given to someone by a court",vi:"bản án, mức án",eg:"She received a five-year **sentence**.",col:["a prison sentence","a harsh sentence"]},
  {w:"to rehabilitate",p:"verb",ipa:"/ˌriːəˈbɪlɪteɪt/",en:"to help a criminal return to a normal, law-abiding life",vi:"cải tạo, phục hồi",eg:"Prisons should **rehabilitate** offenders, not merely punish them.",col:["rehabilitate offenders"]},
  {w:"witness",p:"noun",ipa:"/ˈwɪtnəs/",en:"a person who sees a crime and can describe it",vi:"nhân chứng",eg:"A **witness** described the robbery to police.",col:["a key witness","an eyewitness"]},
  {w:"to prosecute",p:"verb",ipa:"/ˈprɒsɪkjuːt/",en:"to officially charge someone with a crime in court",vi:"truy tố",eg:"The company was **prosecuted** for pollution.",col:["prosecute a case","be prosecuted"]},
  {w:"law-abiding",p:"adjective",ipa:"/ˈlɔː əˌbaɪdɪŋ/",en:"obeying the law",vi:"tuân thủ pháp luật",eg:"Most citizens are **law-abiding** people.",col:["a law-abiding citizen"]},
  {w:"theft",p:"noun",ipa:"/θeft/",en:"the crime of stealing",vi:"hành vi trộm cắp",eg:"Bike **theft** is common in the city centre.",col:["petty theft","report a theft"]},
  {w:"to enforce",p:"verb",ipa:"/ɪnˈfɔːs/",en:"to make sure that a law is obeyed",vi:"thực thi, cưỡng chế",eg:"Police struggle to **enforce** the new rules.",col:["enforce the law","strictly enforce"]},
  {w:"verdict",p:"noun",ipa:"/ˈvɜːdɪkt/",en:"the decision made by a jury at the end of a trial",vi:"phán quyết",eg:"The jury reached a guilty **verdict**.",col:["a guilty verdict","reach a verdict"]},
  {w:"to break the law",p:"phrase",ipa:"/breɪk ðə lɔː/",en:"to do something illegal",vi:"vi phạm pháp luật",eg:"Downloading that content is **breaking the law**.",col:["break the law repeatedly"]},
  {w:"corruption",p:"noun",ipa:"/kəˈrʌpʃn/",en:"dishonest or illegal behaviour by people in power",vi:"tham nhũng",eg:"The scandal exposed widespread **corruption**.",col:["tackle corruption","political corruption"]},
  {w:"fine",p:"noun",ipa:"/faɪn/",en:"a sum of money paid as a punishment",vi:"tiền phạt",eg:"He was given a heavy **fine** for speeding.",col:["pay a fine","a hefty fine"]},
  {w:"to tackle",p:"verb",ipa:"/ˈtækl/",en:"to deal firmly with a difficult problem",vi:"xử lý, giải quyết",eg:"The government aims to **tackle** knife crime.",col:["tackle crime","tackle a problem"]},
  {w:"suspect",p:"noun",ipa:"/ˈsʌspekt/",en:"a person thought to have committed a crime",vi:"nghi phạm",eg:"Police have arrested a **suspect**.",col:["a prime suspect","question a suspect"]},
  {w:"trial",p:"noun",ipa:"/ˈtraɪəl/",en:"the legal process of examining a case in court",vi:"phiên tòa, vụ xử",eg:"The **trial** lasted three weeks.",col:["stand trial","a fair trial"]},
  {w:"to impose",p:"verb",ipa:"/ɪmˈpəʊz/",en:"to officially force a rule or punishment on someone",vi:"áp đặt (hình phạt)",eg:"Courts can **impose** strict penalties.",col:["impose a penalty","impose a fine"]},
  {w:"vandalism",p:"noun",ipa:"/ˈvændəlɪzəm/",en:"the deliberate damaging of property",vi:"hành vi phá hoại",eg:"**Vandalism** of bus shelters is on the rise.",col:["acts of vandalism"]},
  {w:"juvenile",p:"adjective",ipa:"/ˈdʒuːvənaɪl/",en:"relating to young people, especially young offenders",vi:"vị thành niên",eg:"**Juvenile** crime has fallen over the decade.",col:["juvenile crime","a juvenile offender"]},
  {w:"to get away with",p:"phrasal verb",ipa:"/ɡet əˈweɪ wɪð/",en:"to avoid being punished for something wrong",vi:"thoát tội, không bị phạt",eg:"He thought he could **get away with** cheating.",col:["get away with a crime"]},
  {w:"innocent",p:"adjective",ipa:"/ˈɪnəsnt/",en:"not guilty of a crime",vi:"vô tội",eg:"The court found her **innocent**.",col:["presumed innocent","an innocent man"]},
  {w:"a crackdown",p:"noun",ipa:"/ə ˈkrækdaʊn/",en:"strong official action to stop something",vi:"cuộc trấn áp mạnh tay",eg:"Police launched a **crackdown** on drink-driving.",col:["a crackdown on crime"]},
  {w:"bail",p:"noun",ipa:"/beɪl/",en:"money paid so an accused person can be free before trial",vi:"tiền tại ngoại",eg:"He was released on **bail**.",col:["released on bail","grant bail"]},
  {w:"to smuggle",p:"verb",ipa:"/ˈsmʌɡl/",en:"to move goods illegally across borders",vi:"buôn lậu",eg:"They tried to **smuggle** goods across the border.",col:["smuggle drugs","smuggle goods"]},
  {w:"jury",p:"noun",ipa:"/ˈdʒʊəri/",en:"a group of people who decide guilt or innocence in a trial",vi:"bồi thẩm đoàn",eg:"The **jury** deliberated for two days.",col:["a jury of twelve","the jury decided"]},
  {w:"a victim",p:"noun",ipa:"/ə ˈvɪktɪm/",en:"a person who is harmed by a crime or event",vi:"nạn nhân",eg:"More support is offered to **victims** of crime.",col:["a victim of crime","an innocent victim"]},

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function pick(a,n){return shuffle(a).slice(0,n);}
function boldOf(c){const m=c.eg.match(/\*\*(.+?)\*\*/);return m?m[1]:c.w;}
function plain(eg){return eg.replace(/\*\*(.+?)\*\*/g,"$1");}
function distract(others,n,textFn,taken){
  const used=new Set(taken),out=[];
  for(const c of shuffle(others)){const t=textFn(c);if(t&&!used.has(t)){used.add(t);out.push(c);if(out.length===n)break;}}
  return out;
}
function buildQ(card,others,typeId){
  let correctText,correctWhy,ds,stem,gloss=null,tip="";
  if(typeId==="gap"){
    correctText=boldOf(card);
    correctWhy="**"+card.w+"** = "+card.en+". Hợp với ngữ cảnh của câu.";
    ds=distract(others,3,boldOf,[correctText]).map(c=>({text:boldOf(c),why:"**"+boldOf(c)+"** ("+c.w+") = "+c.en+" — không hợp câu này.",correct:false}));
    stem="“"+card.eg.replace(/\*\*.+?\*\*/,"____")+"”";
    gloss=card.en;
    tip="Ví dụ đầy đủ: "+plain(card.eg)+(card.col.length?("   ·   đi với: "+card.col.join(", ")):"");
  } else if(typeId==="context"){
    correctText=card.en;
    correctWhy="Đúng — *"+card.w+"* nghĩa là "+card.en+" ("+card.vi+").";
    ds=distract(others,3,c=>c.en,[correctText]).map(c=>({text:c.en,why:"Đó là nghĩa của *"+c.w+"*, không phải *"+boldOf(card)+"*.",correct:false}));
    stem="“"+card.eg+"”   —   Từ **"+boldOf(card)+"** ở đây nghĩa là gì?";
    gloss="Đoán nghĩa dựa vào ngữ cảnh của câu.";
    tip="*"+card.w+"* = "+card.vi+".";
  } else if(typeId==="colloc"){
    correctText=pick(card.col,1)[0];
    correctWhy="Đúng — “"+correctText+"” là collocation thường gặp của *"+card.w+"*.";
    ds=distract(others.filter(c=>c.col&&c.col.length),3,c=>c.col[0],[correctText]).map(c=>({text:c.col[0],why:"“"+c.col[0]+"” đi với *"+c.w+"*, không phải *"+card.w+"*.",correct:false}));
    stem="Cụm từ nào kết hợp (collocation) đúng với **"+card.w+"**?";
    gloss=card.w+" — "+card.vi;
    tip="Collocation của "+card.w+": "+card.col.join(", ")+".";
  } else if(typeId==="def"){
    correctText=card.w;
    correctWhy="Đúng — *"+card.w+"* = "+card.en+".";
    ds=distract(others,3,c=>c.w,[correctText]).map(c=>({text:c.w,why:"*"+c.w+"* nghĩa là "+c.en+".",correct:false}));
    stem="Từ/cụm nào mang nghĩa sau: “"+card.en+"”?";
    tip="*"+card.w+"* ("+card.p+") = "+card.vi+".   Ví dụ: "+plain(card.eg);
  } else if(typeId==="usage"){
    const w=card.w.replace(/^to /,"");
    correctText=plain(card.eg);
    correctWhy="Đúng — câu này dùng *"+card.w+"* đúng nghĩa: "+card.en+".";
    ds=distract(others,3,c=>c.eg,[card.eg]).map(c=>({text:plain(c.eg).replace(boldOf(c),w),why:"Sai — câu gốc vốn dùng *"+c.w+"* ("+c.en+"), không phải *"+card.w+"*.",correct:false}));
    stem="Câu nào dùng từ **"+card.w+"** đúng cách?";
    gloss=card.w+" = "+card.vi;
    tip="*"+card.w+"* = "+card.en+".";
  } else { /* syn */
    const s=SYN[card.w]||card.en;
    correctText=s;
    correctWhy="Đúng — *"+card.w+"* gần nghĩa với “"+s+"” ("+card.en+").";
    ds=distract(others.filter(c=>SYN[c.w]),3,c=>SYN[c.w],[correctText]).map(c=>({text:SYN[c.w],why:"“"+SYN[c.w]+"” là từ đồng nghĩa của *"+c.w+"*, không phải *"+card.w+"*.",correct:false}));
    stem="Trong câu: “"+card.eg+"”  —  Từ/cụm **"+boldOf(card)+"** gần nghĩa nhất với?";
    gloss="Chọn cách diễn đạt khác cùng nghĩa (paraphrase).";
    tip="*"+card.w+"* = "+card.vi+".   Đồng nghĩa: "+s+".";
  }
  const opts=shuffle([{text:correctText,why:correctWhy,correct:true},...ds]);
  return {t:typeId,tTitle:null,stem,gloss,opts:opts.map(o=>o.text),a:opts.findIndex(o=>o.correct),why:opts.map(o=>o.why),tip};
}
function genQuestions(topic,typeId){
  let pool=topic.cards.slice();
  if(typeId==="colloc") pool=pool.filter(c=>c.col&&c.col.length);
  if(typeId==="syn") pool=pool.filter(c=>SYN[c.w]);
  const bases=pick(pool,Math.min(10,pool.length));
  return bases.map(card=>{const q=buildQ(card,topic.cards.filter(c=>c!==card),typeId);q.tTitle=topic.name;return q;});
}

/* ============================ STATE ============================ */
const PASS=90;
const store={get(){try{return JSON.parse(localStorage.getItem("vlab2")||"{}")}catch(e){return{}}},set(o){try{localStorage.setItem("vlab2",JSON.stringify(o))}catch(e){}}};
let S=Object.assign({deckSeen:{},scores:{},theme:null},store.get());
if(!S.scores)S.scores={}; if(!S.deckSeen)S.deckSeen={};
function save(){store.set(S);}
const app=document.getElementById("app");
let view="home", curTopic=null;
let fc={topic:null,i:0,flipped:false};
let qz=null;

function go(v){view=v;render();window.scrollTo({top:0,behavior:"smooth"});}
document.getElementById("brand").addEventListener("click",()=>go("home"));

function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function bold(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<em>$1</em>").replace(/\*(.+?)\*/g,"<i>$1</i>");}
function topicScores(tid){return S.scores[tid]||{};}
function passedCount(tid){return EX_TYPES.filter(t=>{const s=topicScores(tid)[t.id];return s&&s.pct>=PASS;}).length;}

function render(){
  if(view==="home")return renderHome();
  if(view==="topic")return renderTopic();
  if(view==="flash")return renderFlash();
  if(view==="test")return renderQuiz();
  if(view==="result")return renderResult();
}

/* ============================ TOPIC ============================ */
function openTopic(tid){curTopic=tid;go("topic");}
function renderTopic(){

  const full=topicScores(t.id).__full;
  const fullLabel=full?`<span class="status" style="color:${full.pct>=PASS?'var(--good)':'var(--amber)'};font-weight:600">Bài tổng: ${full.pct}%</span>`:"";
  const rows=EX_TYPES.map((ex,i)=>{
    const s=topicScores(t.id)[ex.id];
    const label=s?`<span class="status" style="color:${s.pct>=PASS?'var(--good)':'var(--amber)'};font-weight:600">${s.pct>=PASS?'✓ Đạt':'Cần cải thiện'} · ${s.pct}%</span>`
                 :`<span class="status" style="color:var(--ink-soft)">Chưa làm</span>`;
    return `<div class="deck">
      <div class="top-row"><h3 style="font-size:1.05rem">${i+1}. ${esc(ex.name)}</h3><span class="tag">10 câu</span></div>
      <div class="meta"><span>${esc(ex.blurb)}</span></div>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:.6rem">

    <div class="eyebrow">${esc(t.tag)}</div>
    <h2 style="font-size:1.5rem;margin:.1rem 0 .3rem">${esc(t.name)}</h2>
    <p style="color:var(--ink-soft);margin:0 0 1rem">30 từ · 6 dạng bài tập, mỗi dạng 10 câu. Làm lẻ từng dạng, hoặc làm bài tổng 60 câu để kiểm tra toàn chủ đề.</p>
    <div style="display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-bottom:1.5rem">
      <button class="btn" id="flashBtn">📇 Học 30 thẻ</button>
      <button class="btn" id="fullBtn" style="background:var(--amber)">🧩 Làm bài tổng (60 câu)</button>
      ${fullLabel}
    </div>
    <div class="eyebrow" style="margin-bottom:.7rem">Hoặc làm lẻ từng dạng</div>
    <div class="grid">${rows}</div>

  document.getElementById("back").addEventListener("click",()=>go("home"));
  document.getElementById("flashBtn").addEventListener("click",()=>openFlash(t.id));
  document.getElementById("fullBtn").addEventListener("click",()=>startFull(t.id));
