}

/* ============================ FLASHCARDS ============================ */
function openFlash(tid){fc={topic:tid,i:0,flipped:false};go("flash");}
function renderFlash(){
  const t=TOPICS.find(x=>x.id===fc.topic);
  const c=t.cards[fc.i], total=t.cards.length;
  S.deckSeen[t.id]=Math.max(S.deckSeen[t.id]||0,fc.i+1);save();
  const done=fc.i===total-1;
  const dots=total<=16?`<div class="dots">${t.cards.map((_,k)=>`<i class="${k===fc.i?'on':''}"></i>`).join("")}</div>`:"";
  app.innerHTML=`<section class="view">
    <div class="fc-head">
      <div><div class="eyebrow">${esc(t.tag)} · Flashcards</div><h2 style="font-size:1.35rem">${esc(t.name)}</h2></div>
      <div class="fc-count">${fc.i+1} / ${total}</div>
    </div>
    <div class="flash ${fc.flipped?'flipped':''}" id="flash">
      <div class="flash-inner">
        <div class="face front">
          <div class="pos">${esc(c.p)}</div>
          <div class="word">${esc(c.w)}</div>
          <div class="ipa">${esc(c.ipa)}</div>
          <div class="flip-hint">Nhấn vào thẻ để xem nghĩa →</div>
        </div>
        <div class="face back">
          <div class="pos">${esc(c.w)} · ${esc(c.p)}</div>
          <div class="def-block"><div class="def-label">Definition</div>
            <div class="def-en">${esc(c.en)}</div><div class="def-vi">${esc(c.vi)}</div></div>
          <div class="eg">${bold(c.eg)}</div>
          <div class="colloc">${c.col.map(x=>`<span>${esc(x)}</span>`).join("")}</div>
        </div>
      </div>
    </div>
    <div class="fc-nav">
      <button class="icon-btn" id="prev" ${fc.i===0?'disabled':''} aria-label="Trước">←</button>
      ${dots||`<span class="fc-count">thẻ ${fc.i+1}/${total}</span>`}
      <button class="icon-btn" id="next" ${done?'disabled':''} aria-label="Sau">→</button>
    </div>
    ${done?`<div class="fc-done">
      <h3 style="font-size:1.2rem;margin-bottom:.4rem">Xong 30 thẻ! ✅</h3>
      <p style="color:var(--ink-soft);margin:0 0 1rem">Vào làm bài tập của chủ đề <b>${esc(t.name)}</b> nhé.</p>
      <div style="display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap">
        <button class="btn" id="toQuiz">Làm bài tập chủ đề này</button>
        <button class="btn ghost" id="back1">Về trang chủ</button>

    <div style="text-align:center;margin-top:1.3rem">
      <button class="btn ghost" id="backHome" style="font-size:.86rem">← Tất cả chủ đề</button>
    </div>
  </section>`;
  const flash=document.getElementById("flash");
  flash.addEventListener("click",()=>{fc.flipped=!fc.flipped;flash.classList.toggle("flipped");});
  const prev=document.getElementById("prev"),next=document.getElementById("next");
  if(prev)prev.addEventListener("click",()=>{if(fc.i>0){fc.i--;fc.flipped=false;renderFlash();}});
  if(next)next.addEventListener("click",()=>{if(fc.i<total-1){fc.i++;fc.flipped=false;renderFlash();}});
  document.getElementById("backHome").addEventListener("click",()=>go("home"));
  const tq=document.getElementById("toQuiz");if(tq)tq.addEventListener("click",()=>openTopic(t.id));
  const b1=document.getElementById("back1");if(b1)b1.addEventListener("click",()=>go("home"));

/* ============================ QUIZ ============================ */
function runQuiz(tid,types,mode){
  const t=TOPICS.find(x=>x.id===tid);
  let qs=[];
  types.forEach(ty=>{qs=qs.concat(genQuestions(t,ty));});
  qz={tid,types,mode,title:t.name,qs,i:0,answers:new Array(qs.length).fill(null)};
  go("test");
}
function startSingle(tid,typeId){runQuiz(tid,[typeId],"single");}
function startFull(tid){runQuiz(tid,ALL_TYPES,"full");}
function startWeak(tid,types){runQuiz(tid,types,"full");}

const KEYS=["A","B","C","D"];
function renderQuiz(){
  const q=qz.qs[qz.i], ans=qz.answers[qz.i], answered=ans!==null, total=qz.qs.length;
  const blankHTML=answered?`<span class="blank filled">${esc(q.opts[q.a])}</span>`:`<span class="blank"></span>`;
  const stem=bold(q.stem).replace(/____/g,blankHTML);
  const opts=q.opts.map((o,k)=>{
    let cls="";
    if(answered){ if(k===q.a)cls="correct"; else if(k===ans)cls="wrong"; }
    const mark=answered?(k===q.a?'<span class="mark">✓ đúng</span>':(k===ans?'<span class="mark">✗ bạn chọn</span>':'')):'';
    return `<button class="opt ${cls}" data-k="${k}" ${answered?'disabled':''}>
      <span class="key">${KEYS[k]}</span><span style="flex:1 1 auto;min-width:0">${bold(o)}</span>${mark}</button>`;
  }).join("");
  let analysis="";
  if(answered){
    const ok=ans===q.a, correctText=q.opts[q.a];
    const body=ok
      ? `<p>${bold(q.why[q.a]||("“"+correctText+"” là đáp án đúng."))}</p>`
      : `<div class="row"><b>Đáp án đúng:</b> ${bold(correctText)} — ${bold(q.why[q.a]||"")}</div>
         <div class="why-wrong"><b>Vì sao “${esc(q.opts[ans])}” chưa đúng:</b> ${bold(q.why[ans]||"không phù hợp trong ngữ cảnh này.")}</div>`;
    analysis=`<div class="analysis ${ok?'ok':'no'}">
      <div class="verdict">${ok?'✓ Chính xác!':'✗ Chưa đúng'}</div>${body}
      ${q.tip?`<div class="tip"><b>💡 Mẹo:</b> ${bold(q.tip)}</div>`:''}</div>`;
  }
  const isLast=qz.i===total-1;
  const eyebrow=qz.mode==="full"?(esc(qz.title)+" · Bài tổng"):esc(qz.title);
  app.innerHTML=`<section class="view">
    <div class="quiz-head">
      <div class="eyebrow">${eyebrow}</div>
      <div class="qpos">Câu ${qz.i+1} / ${total}</div>
    </div>
    <div class="qcard">
      <div class="qtype">${esc(TYPE_NAME[q.t])}</div>
      <div class="qstem">${stem}</div>
      ${q.gloss?`<div class="qgloss">Gợi ý: ${esc(q.gloss)}</div>`:''}
      <div class="opts">${opts}</div>
      ${analysis}
      <div class="qfoot">
        ${answered?`<span class="locked-note">✓ Đã đọc phân tích? Tiếp tục nhé.</span>`:`<span class="locked-note">🔒 Chọn đáp án để mở phân tích &amp; nút tiếp theo</span>`}
        <button class="btn" id="nextq" ${answered?'':'disabled'}>${isLast?'Xem kết quả':'Câu tiếp theo →'}</button>
      </div>
    </div>
    <div style="text-align:center;margin-top:1.2rem">
      <button class="btn ghost" id="quit" style="font-size:.84rem">Thoát về danh sách bài</button>
    </div>
  </section>`;
  app.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
    if(qz.answers[qz.i]!==null)return;
    qz.answers[qz.i]=parseInt(b.dataset.k);renderQuiz();
  }));
  document.getElementById("nextq").addEventListener("click",()=>{
    if(qz.answers[qz.i]===null)return;
    if(isLast){finishQuiz();}else{qz.i++;renderQuiz();window.scrollTo({top:0,behavior:"smooth"});}
  });
  document.getElementById("quit").addEventListener("click",()=>openTopic(qz.tid));
}

/* ============================ RESULT ============================ */
function finishQuiz(){
  const correct=qz.qs.filter((q,k)=>qz.answers[k]===q.a).length;
  const pct=Math.round(correct/qz.qs.length*100);
  const tm=S.scores[qz.tid]||(S.scores[qz.tid]={});
  // update best score for each exercise type that appeared
  qz.types.forEach(ty=>{
    const idx=qz.qs.map((q,k)=>({q,k})).filter(x=>x.q.t===ty);
    if(!idx.length)return;
    const c=idx.filter(x=>qz.answers[x.k]===x.q.a).length;
    const p=Math.round(c/idx.length*100);
    const prev=tm[ty];
    tm[ty]={pct:Math.max(p,prev?prev.pct:0),correct:c,n:idx.length,last:p};
  });
  if(qz.mode==="full"){const prev=tm.__full;tm.__full={pct:Math.max(pct,prev?prev.pct:0),correct,n:qz.qs.length,last:pct};}
  save();
  qz.result={correct,pct};
  go("result");
}
function ring(pct,passed){
  const circ=2*Math.PI*72, off=circ*(1-pct/100);
  const col=passed?'var(--good)':(pct>=70?'var(--amber)':'var(--bad)');
  return `<div class="score-ring">
    <svg width="170" height="170" viewBox="0 0 170 170">
      <circle cx="85" cy="85" r="72" fill="none" stroke="var(--surface-2)" stroke-width="13"/>
      <circle cx="85" cy="85" r="72" fill="none" stroke="${col}" stroke-width="13" stroke-linecap="round"
        stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>
    </svg><div class="pct"><b style="color:${col}">${pct}%</b><span>${qz.result.correct}/${qz.qs.length} đúng</span></div></div>`;
}
function renderResult(){
  const {correct,pct}=qz.result, passed=pct>=PASS;
  if(qz.mode==="full"){
    const byType=qz.types.map(ty=>{
      const idx=qz.qs.map((q,k)=>({q,k})).filter(x=>x.q.t===ty);
      const c=idx.filter(x=>qz.answers[x.k]===x.q.a).length;
      return {ty,name:TYPE_NAME[ty],c,n:idx.length,pct:Math.round(c/idx.length*100)};
    });
    const rows=byType.map(b=>`<div class="brow">
      <span class="n">${esc(b.name)}</span><span class="sc">${b.c}/${b.n}</span>
      <span class="pill ${b.pct>=PASS?'pass':'fail'}">${b.pct}%</span></div>`).join("");
    const weak=byType.filter(b=>b.pct<PASS).map(b=>b.ty);
    app.innerHTML=`<section class="view"><div class="result">
      <div class="eyebrow">Bài tổng · ${esc(qz.title)}</div>
      ${ring(pct,passed)}
      <div class="verdict-big">${passed?'🎉 Đạt yêu cầu!':'🎯 Gần rồi — cố thêm chút nữa!'}</div>
      <p class="sub">${passed?'Bạn đã vượt mốc '+PASS+'% cho toàn chủ đề. Xuất sắc!':'Toàn bài cần đạt '+PASS+'%. Xem từng phần bên dưới và làm lại phần điểm thấp để cải thiện.'}</p>
      <div class="eyebrow" style="text-align:left">Điểm theo từng dạng</div>
      <div class="breakdown">${rows}</div>
      <div class="actions">
        ${weak.length?`<button class="btn amber" id="weak">Làm lại ${weak.length} phần điểm thấp (${weak.length*10} câu)</button>`:''}
        <button class="btn ${passed?'ghost':''}" id="retry">Làm lại cả bài tổng</button>
        <button class="btn ghost" id="other">Danh sách các dạng</button>
        <button class="btn ghost" id="home">Trang chủ</button>
      </div>
      ${weak.length?`<p class="mini">Cần cải thiện: ${weak.map(t=>esc(TYPE_NAME[t])).join(" · ")}</p>`:''}
    </div></section>`;
    const wk=document.getElementById("weak");if(wk)wk.addEventListener("click",()=>startWeak(qz.tid,weak));
    document.getElementById("retry").addEventListener("click",()=>startFull(qz.tid));
    document.getElementById("other").addEventListener("click",()=>openTopic(qz.tid));
    document.getElementById("home").addEventListener("click",()=>go("home"));
    if(passed)burst();
    return;
  }
  // single-exercise result
  const typeId=qz.types[0], total=qz.qs.length;
  const wrong=qz.qs.map((q,k)=>({q,k,chosen:qz.answers[k]})).filter(x=>x.chosen!==x.q.a);
  const wrongList=wrong.length?`<div class="eyebrow" style="text-align:left">Các câu cần xem lại (${wrong.length})</div>
    <div class="breakdown">${wrong.map(x=>`<div class="brow">
      <span class="n">Câu ${x.k+1}: <b>${esc(x.q.opts[x.q.a])}</b></span>
      <span class="pill fail">bạn chọn: ${esc(x.q.opts[x.chosen])}</span></div>`).join("")}</div>`:'';
  app.innerHTML=`<section class="view"><div class="result">
    <div class="eyebrow">${esc(TYPE_NAME[typeId])} · ${esc(qz.title)}</div>
    ${ring(pct,passed)}
    <div class="verdict-big">${passed?'🎉 Đạt yêu cầu!':'🎯 Gần rồi — cố thêm chút nữa!'}</div>
    <p class="sub">${passed?'Bạn đã vượt mốc '+PASS+'% cho dạng bài này. Rất tốt!':'Dạng bài này cần đạt '+PASS+'% (9/10). Xem lại các câu sai rồi làm lại — đề sẽ được xáo mới.'}</p>
    ${wrongList}
    <div class="actions">
      <button class="btn ${passed?'ghost':'amber'}" id="retry">Làm lại dạng này</button>
      <button class="btn ghost" id="other">Dạng bài khác</button>
      <button class="btn ghost" id="review">📇 Ôn thẻ</button>
      <button class="btn ${passed?'':'ghost'}" id="home">Trang chủ</button>
    </div>
  </div></section>`;
  document.getElementById("retry").addEventListener("click",()=>startSingle(qz.tid,typeId));
  document.getElementById("other").addEventListener("click",()=>openTopic(qz.tid));
  document.getElementById("review").addEventListener("click",()=>openFlash(qz.tid));
  document.getElementById("home").addEventListener("click",()=>go("home"));
  if(passed)burst();
}

/* ============================ CONFETTI ============================ */
function burst(){
  const c=document.createElement("canvas");c.className="confetti";
  c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);
  const ctx=c.getContext("2d"),cols=["#0e7c6b","#b5781a","#1f7a4d","#3ec9af","#e3a94a"];
  let P=Array.from({length:120},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.3,
    r:4+Math.random()*6,vy:2+Math.random()*4,vx:-2+Math.random()*4,col:cols[Math.random()*cols.length|0],a:1,rot:Math.random()*6}));
  let t0=performance.now();
  (function loop(t){ctx.clearRect(0,0,c.width,c.height);
    P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.rot+=.1;p.a-=.006;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=Math.max(0,p.a);
      ctx.fillStyle=p.col;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);ctx.restore();});
    if(t-t0<2600 && !matchMedia("(prefers-reduced-motion:reduce)").matches)requestAnimationFrame(loop);else c.remove();
  })(t0);
}

/* ============================ THEME ============================ */
const tbtn=document.getElementById("theme");
function applyTheme(){const th=S.theme;if(th)document.documentElement.setAttribute("data-theme",th);else document.documentElement.removeAttribute("data-theme");}
tbtn.addEventListener("click",()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const isDark=cur==="dark"||(!cur&&matchMedia("(prefers-color-scheme:dark)").matches);
  S.theme=isDark?"light":"dark";save();applyTheme();
});
applyTheme();
render();
</script>
